<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Neonic · palette-cycle drawing tool</title>
<meta name="viewport" content="width=device-width,initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700;12..96,800&family=Geist:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" />
<style>
  :root {
    --paper: #f6f3ec;
    --paper-2: #efeae0;
    --ink: #1b1a17;
    --ink-2: #3a3833;
    --muted: #7a766b;
    --line: rgba(27,26,23,.10);
    --line-2: rgba(27,26,23,.18);
    --chip-bg: #ffffff;
    --hot: #ff3366;
    --cool: #1f6feb;
    --warm: #ff8a3d;
    --mint: #1fb88a;
    --violet: #7a5af0;
    --yellow: #f5c518;
    --accent: #1f6feb;
    --shadow-sm: 0 1px 0 rgba(255,255,255,.6) inset, 0 1px 2px rgba(0,0,0,.04);
    --shadow-md: 0 1px 0 rgba(255,255,255,.6) inset, 0 6px 18px rgba(27,26,23,.06), 0 1px 2px rgba(0,0,0,.05);
    --radius: 14px;
  }

  html, body { background: var(--paper); }
  body {
    margin: 0;
    font-family: 'Geist', ui-sans-serif, system-ui, sans-serif;
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    min-height: 100vh;
    background:
      radial-gradient(1200px 600px at 80% -10%, rgba(255,138,61,.10), transparent 60%),
      radial-gradient(1000px 700px at -10% 110%, rgba(31,111,235,.08), transparent 55%),
      var(--paper);
  }
  * { box-sizing: border-box; }

  /* ─── Layout ─────────────────────────────────────────────────── */
  .app { max-width: 1440px; margin: 0 auto; padding: 18px 22px 28px; }

  .hdr {
    display: flex; align-items: center; justify-content: space-between;
    gap: 20px; padding: 2px 4px 18px;
  }
  .brand { display:flex; align-items:center; gap: 14px; }
  .glyph {
    width: 44px; height: 44px; flex: 0 0 auto;
    border-radius: 8px; overflow: hidden;
  }
  .glyph canvas { width: 100%; height: 100%; display: block; }

  .wordmark {
    font-family: 'Bricolage Grotesque', 'Geist', sans-serif;
    font-weight: 800; font-size: 30px; letter-spacing: -0.02em;
    line-height: 1; color: var(--ink);
    font-variation-settings: "wdth" 110, "opsz" 24;
  }
  .tag {
    font-family: 'JetBrains Mono', ui-monospace, monospace;
    font-size: 11px; letter-spacing: .04em; color: var(--muted);
    text-transform: uppercase; margin-top: 4px;
  }

  .hdr-mid {
    display:flex; align-items:center; gap: 10px;
    font-family: 'Bricolage Grotesque', sans-serif;
    font-weight: 600; font-size: 22px; color: var(--ink);
    line-height: 1.1; max-width: 460px;
    letter-spacing: -.01em;
    font-variation-settings: "wdth" 100, "opsz" 22;
  }

  .hdr-r { display:flex; align-items:center; gap: 10px; }

  /* ─── Buttons ────────────────────────────────────────────────── */
  .btn {
    appearance:none; border: 1px solid var(--line-2); background: var(--chip-bg);
    color: var(--ink); border-radius: 999px; padding: 9px 15px;
    font: 500 13px/1 'Geist', sans-serif; cursor: default;
    display:inline-flex; align-items:center; gap:8px;
    box-shadow: var(--shadow-sm); white-space: nowrap;
    text-decoration: none;
    transition: transform .15s ease, background .15s ease, color .15s ease;
  }
  .btn:hover { transform: translateY(-1px); }
  .btn:disabled { opacity: .35; pointer-events: none; }
  .btn.primary { background: var(--ink); color: var(--paper); border-color: var(--ink); }
  .btn.primary:hover { background: #2a2823; }
  .btn.ghost { background: transparent; box-shadow: none; }
  .btn.juicy {
    color: white; border: 0;
    padding: 9px 15px; font-weight: 600;
    background: #1fb88a;
    box-shadow:
      0 4px 12px rgba(31,184,138,.30),
      0 1px 0 rgba(255,255,255,.25) inset,
      0 -1px 0 rgba(0,0,0,.08) inset;
  }
  .btn.juicy:hover { background: #19a378; transform: translateY(-1px); }

  /* ─── Grid ───────────────────────────────────────────────────── */
  .grid {
    display: grid;
    grid-template-columns: 1.05fr .95fr;
    grid-template-rows: minmax(0, 1fr) minmax(0, 1fr);
    gap: 14px;
    height: calc(100vh - 130px);
    min-height: 660px;
  }
  .panel {
    background: var(--chip-bg);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    box-shadow: var(--shadow-md);
    display: flex; flex-direction: column; overflow: hidden;
    position: relative;
    min-width: 0;
  }
  .panel-hd {
    display:flex; align-items:center; justify-content:space-between;
    gap: 14px; padding: 12px 14px 8px;
    flex-shrink: 0;
  }
  .panel-hd-l { display: flex; align-items:center; gap: 12px; min-width:0; }
  .step {
    width: 30px; height: 30px; flex: 0 0 auto;
    border-radius: 9px;
    display:grid; place-items:center;
    font-family: 'Bricolage Grotesque', sans-serif;
    font-weight: 700; font-size: 14px; color: white;
    box-shadow: 0 4px 10px rgba(0,0,0,.10), 0 1px 0 rgba(255,255,255,.25) inset;
  }
  .step.s1 { background: linear-gradient(160deg, #ff3366, #ff7a3d); }
  .step.s2 { background: linear-gradient(160deg, #7a5af0, #b86cf0); }
  .step.s3 { background: linear-gradient(160deg, #1fb88a, #4cc9a6); }
  .step.s4 { background: linear-gradient(160deg, #1f6feb, #58a6ff); }

  .h2 {
    font-family: 'Bricolage Grotesque', sans-serif;
    font-weight: 700; font-size: 22px; line-height: 1;
    letter-spacing: -.015em; margin: 0;
    color: var(--ink); white-space: nowrap;
    font-variation-settings: "wdth" 100, "opsz" 24;
  }
  .panel-hd-r { display: flex; align-items:center; gap: 6px; flex-shrink: 0; }

  .panel-body { flex: 1; min-height: 0; padding: 2px 14px 12px;
                display: flex; flex-direction: column; }
  .panel-foot {
    border-top: 1px solid var(--line);
    padding: 10px 14px;
    display: flex; align-items:center; gap: 10px; flex-wrap: nowrap;
    background: linear-gradient(180deg, transparent, rgba(0,0,0,.015));
    flex-shrink: 0;
  }

  /* ─── Chips & segmented ──────────────────────────────────────── */
  .chip {
    appearance: none;
    border: 1px solid var(--line-2); background: var(--chip-bg);
    border-radius: 999px; padding: 7px 11px;
    font: 500 12px/1 'Geist', sans-serif; color: var(--ink-2);
    display:inline-flex; align-items:center; gap: 6px;
    cursor: default; white-space: nowrap;
  }
  .chip.mono { font-family:'JetBrains Mono', monospace; font-size: 11px; }
  .chip svg { width: 12px; height: 12px; }
  button.chip:hover { border-color: var(--ink); color: var(--ink); }
  .chip:disabled { opacity: .35; pointer-events: none; }

  /* Compound zoom chip: [−] <input %> [+] */
  .chip.zoom { padding: 3px 4px; gap: 0; }
  .chip.zoom button {
    appearance: none; border: 0; background: transparent; color: inherit;
    padding: 3px 8px; border-radius: 999px; cursor: default;
    font-family: 'JetBrains Mono', monospace; font-size: 12px;
    min-width: 20px;
  }
  .chip.zoom button:hover { background: rgba(0,0,0,.06); color: var(--ink); }
  .chip.zoom input {
    appearance: none; border: 0; background: transparent; color: var(--ink);
    font: 500 11px/1 'JetBrains Mono', monospace; padding: 4px 2px;
    text-align: center; width: 3.4em; outline: none;
  }
  .chip.zoom input:focus { background: var(--paper-2); border-radius: 999px; }

  .seg {
    display: inline-flex; background: var(--chip-bg);
    border: 1px solid var(--line-2); border-radius: 999px; padding: 2px;
    box-shadow: var(--shadow-sm);
  }
  .seg button {
    appearance:none; border: 0; background: transparent;
    font: 500 12px/1 'Geist', sans-serif;
    padding: 5px 11px; border-radius: 999px; color: var(--ink-2);
    cursor: default; transition: color .15s ease, background .15s ease;
  }
  .seg button:hover { color: var(--ink); }
  .seg button.on { background: var(--ink); color: var(--paper); }

  /* ─── Sliders ────────────────────────────────────────────────── */
  .slider-row { display:flex; align-items:center; gap: 8px; }
  .slider-row label { font: 500 11px/1 'JetBrains Mono', monospace;
    color: var(--muted); white-space:nowrap;
    text-transform: uppercase; letter-spacing: .06em; }
  .slider-row .val { font:600 11px/1 'JetBrains Mono', monospace;
    color: var(--ink); min-width: 28px; text-align:right; }
  input[type=range].nslider {
    -webkit-appearance: none; appearance: none;
    width: 90px; height: 22px; background: transparent; cursor: default;
  }
  input[type=range].nslider::-webkit-slider-runnable-track {
    height: 4px; background: var(--paper-2); border-radius: 2px;
    border: 1px solid var(--line);
  }
  input[type=range].nslider::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 14px; height: 14px; border-radius: 50%;
    background: var(--ink); margin-top: -6px;
    border: 2px solid var(--paper); box-shadow: 0 1px 3px rgba(0,0,0,.2);
  }
  input[type=range].nslider::-moz-range-track {
    height: 4px; background: var(--paper-2); border-radius: 2px;
    border: 1px solid var(--line);
  }
  input[type=range].nslider::-moz-range-thumb {
    width: 14px; height: 14px; border-radius: 50%;
    background: var(--ink); border: 2px solid var(--paper); cursor: default;
  }

  /* ─── Canvas wrappers ───────────────────────────────────────── */
  .canvas-wrap {
    flex:1; min-height: 0; position: relative;
    border-radius: 10px; overflow: hidden;
    background:
      linear-gradient(90deg, rgba(0,0,0,.03) 1px, transparent 1px) 0 0/24px 24px,
      linear-gradient(0deg,  rgba(0,0,0,.03) 1px, transparent 1px) 0 0/24px 24px,
      #fbf8f1;
    border: 1px dashed var(--line-2);
  }
  .canvas-wrap canvas {
    position: absolute; inset: 0;
    width: 100%; height: 100%; display: block;
    touch-action: none;
    user-select: none; -webkit-user-select: none;
    cursor: crosshair;
  }
  .edit-wrap {
    flex:1; min-height: 0; position: relative;
    border-radius: 10px; overflow: hidden;
    background:
      linear-gradient(90deg, rgba(0,0,0,.04) 1px, transparent 1px) 0 0/12px 12px,
      linear-gradient(0deg,  rgba(0,0,0,.04) 1px, transparent 1px) 0 0/12px 12px,
      #f8f5ee;
    border: 1px solid var(--line);
  }
  .edit-wrap canvas {
    position: absolute; inset: 0;
    width: 100%; height: 100%; display: block;
    touch-action: none;
    user-select: none; -webkit-user-select: none;
    cursor: default;
  }
  canvas#bezier.pan-mode { cursor: grab; }
  canvas#bezier.panning  { cursor: grabbing; }

  .anim-wrap {
    flex:1; min-height: 0; position: relative;
    border-radius: 10px; overflow: hidden;
    background: #14110d;
    background-image:
      radial-gradient(800px 400px at 50% 130%, rgba(255,138,61,.18), transparent 60%),
      radial-gradient(600px 400px at 50% -20%, rgba(31,111,235,.15), transparent 60%);
    box-shadow: inset 0 0 0 1px rgba(255,255,255,.04);
    display: grid; place-items: center; padding: 4px;
  }
  canvas#out {
    display: block; max-width: 100%; max-height: 100%;
    min-width: 0; min-height: 0;
    height: auto; image-rendering: pixelated;
    filter: drop-shadow(0 8px 22px rgba(0,0,0,.5));
  }

  /* ─── Palettes panel — wrap only; drawer guts preserved ─── */
  .palettes-pane { flex: 1; min-height: 0; overflow: auto;
                   padding: 4px 2px;
                   display: flex; flex-direction: column; gap: 10px; }
  .palette-subtitle { color: var(--muted); font-size: 11px;
    font-family: 'JetBrains Mono', monospace;
    text-transform: uppercase; letter-spacing: .06em; margin: 0 0 4px; }
  .playlist { display: flex; flex-direction: column; gap: 8px; }

  /* === preserved playlist editor === */
  .pal-row {
    display: grid; grid-template-rows: auto 0fr;
    background: var(--paper);
    border: 1px solid var(--line); border-radius: 12px;
    font: 12px 'Geist', ui-sans-serif, system-ui, sans-serif;
    cursor: default;
    transition: grid-template-rows 200ms ease,
                background-color 150ms ease,
                border-color 150ms ease;
    overflow: hidden;
  }
  .pal-row.open { grid-template-rows: auto 1fr;
    border-color: var(--ink); background: #fffbf3; }
  .pal-row.dragging { opacity: .35; }
  .pal-row.drag-over { border-color: var(--ink); border-style: dashed; }

  .pal-row-head {
    display: flex; align-items: center; gap: 10px;
    padding: 8px 10px; min-width: 0;
  }
  .pal-row-head:hover { background: rgba(0,0,0,.025); }
  .pal-row.open .pal-row-head:hover { background: transparent; }

  .pal-row .play-marker {
    color: var(--cool); font-size: 10px;
    width: 10px; opacity: 0; flex-shrink: 0;
  }
  .pal-row.playing .play-marker { opacity: 1; }
  .pal-row .grip {
    cursor: grab; color: var(--muted);
    user-select: none; font-family: 'JetBrains Mono', monospace; font-size: 14px;
    flex-shrink: 0;
  }
  .pal-row .swatch {
    flex: 1; min-width: 0;
    height: 22px; border-radius: 4px;
    display: block;
  }
  .pal-row .row-field {
    display: inline-flex; align-items: center; gap: 4px;
    color: var(--muted); flex-shrink: 0;
  }
  .pal-row .row-field input {
    width: 3.2em; padding: 2px 4px;
    font: 11px 'Geist', ui-sans-serif, system-ui, sans-serif;
    background: #fafaf6; color: var(--ink);
    border: 1px solid var(--line); border-radius: 4px;
  }

  .pal-row-drawer { overflow: hidden; min-height: 0; }
  .pal-row-drawer-inner {
    padding: 12px 12px 14px; display: flex; flex-direction: column; gap: 12px;
    border-top: 1px dashed var(--ink); margin: 0 10px;
  }
  .drawer-row {
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
  }
  .preset-name {
    width: 9em; flex: 0 0 9em; min-width: 0;
    padding: 5px 9px;
    font: 12px 'Geist', ui-sans-serif, system-ui, sans-serif;
    background: #fafaf6; color: var(--ink);
    border: 1px solid var(--line); border-radius: 6px;
  }
  .preset-select {
    max-width: 11em;
    padding: 5px 9px;
    font: 12px 'Geist', ui-sans-serif, system-ui, sans-serif;
    background: #fafaf6; color: var(--ink);
    border: 1px solid var(--line); border-radius: 6px;
  }
  .drawer-ramp {
    display: block; width: 100%; height: 78px;
    background: #fafaf6; border-radius: 6px;
    user-select: none; -webkit-user-select: none; touch-action: none;
  }
  .drawer-ramp-row { display: flex; flex-direction: column; gap: 0; }
  .stop-row .color-square {
    display: inline-flex; align-items: center; gap: 6px;
    color: var(--muted);
  }
  .stop-row input[type=color] {
    width: 30px; height: 24px; padding: 0;
    border: 1px solid var(--line); border-radius: 4px;
    background: transparent;
  }
  .stop-helper { color: var(--muted); font-style: italic; font-size: 11px; }
  .stop-row .spacer { flex: 1; }
  .stop-row .remove-palette {
    appearance: none; background: transparent;
    color: #c8462b; border: 1px solid #c8462b;
    border-radius: 999px; padding: 6px 11px;
    font: 500 12px/1 'Geist', sans-serif; cursor: default;
  }
  .stop-row .remove-palette:hover { background: rgba(200,70,43,.08); }
  /* drawer buttons that aren't part of the new chip/btn system */
  .pal-row-drawer-inner button:not(.remove-palette):not(.chip):not(.btn) {
    appearance: none; background: var(--chip-bg);
    border: 1px solid var(--line-2); color: var(--ink-2);
    border-radius: 999px; padding: 6px 11px;
    font: 500 12px/1 'Geist', sans-serif; cursor: default;
  }
  .pal-row-drawer-inner button:not(.remove-palette):not(.chip):not(.btn):hover {
    border-color: var(--ink); color: var(--ink);
  }

  ::selection { background: rgba(255,51,102,.2); color: var(--ink); }

  /* ─── Responsive ─────────────────────────────────────────────── */
  @media (max-width: 820px) { .hdr-mid { display: none; } }
  @media (max-width: 960px) {
    .app { padding: 14px 14px 22px; }
    .grid { gap: 10px; height: calc(100vh - 110px); }
    .h2 { font-size: 18px; }
    .wordmark { font-size: 26px; }
    .panel-foot { padding: 8px 10px; }
  }
  @media (max-width: 720px) {
    .grid { grid-template-columns: 1fr;
            grid-template-rows: repeat(4, minmax(360px, auto));
            height: auto; }
  }

  /* ─── Dark mode (OS preference) ─────────────────────────────── */
  @media (prefers-color-scheme: dark) {
    :root {
      --paper: #15151a;
      --paper-2: #1c1c22;
      --ink: #e8e6df;
      --ink-2: #c6c4be;
      --muted: #8a8780;
      --line: rgba(232,230,223,.10);
      --line-2: rgba(232,230,223,.18);
      --chip-bg: #1f1f24;
      --shadow-sm: 0 1px 0 rgba(255,255,255,.04) inset, 0 1px 2px rgba(0,0,0,.4);
      --shadow-md: 0 1px 0 rgba(255,255,255,.04) inset,
                   0 6px 18px rgba(0,0,0,.40), 0 1px 2px rgba(0,0,0,.4);
    }
    body {
      background:
        radial-gradient(1200px 600px at 80% -10%, rgba(255,138,61,.07), transparent 60%),
        radial-gradient(1000px 700px at -10% 110%, rgba(31,111,235,.07), transparent 55%),
        var(--paper);
    }
    .btn.primary { background: var(--ink); color: #14110d; border-color: var(--ink); }
    .btn.primary:hover { background: #fffefb; }
    .seg button.on { background: var(--ink); color: #14110d; }
    .canvas-wrap {
      background:
        linear-gradient(90deg, rgba(255,255,255,.04) 1px, transparent 1px) 0 0/24px 24px,
        linear-gradient(0deg,  rgba(255,255,255,.04) 1px, transparent 1px) 0 0/24px 24px,
        #0e0e12;
      border-color: var(--line-2);
    }
    .edit-wrap {
      background:
        linear-gradient(90deg, rgba(255,255,255,.04) 1px, transparent 1px) 0 0/12px 12px,
        linear-gradient(0deg,  rgba(255,255,255,.04) 1px, transparent 1px) 0 0/12px 12px,
        #14141a;
      border-color: var(--line);
    }
    input[type=range].nslider::-webkit-slider-thumb { border-color: var(--paper); }
    input[type=range].nslider::-moz-range-thumb     { border-color: var(--paper); }
    .pal-row { background: var(--paper-2); border-color: var(--line); }
    .pal-row.open { background: #24244a; border-color: var(--ink); }
    .pal-row-head:hover { background: rgba(255,255,255,.04); }
    .pal-row .row-field input,
    .preset-name, .preset-select { background: #0e0e12; color: var(--ink);
                                   border-color: var(--line); }
    .drawer-ramp { background: #0e0e12; }
    .stop-row .remove-palette { color: #ff7b58; border-color: #ff7b58; }
    .stop-row .remove-palette:hover { background: rgba(255,123,88,.1); }
    .chip.zoom button:hover { background: rgba(255,255,255,.06); }
    .chip.zoom input:focus { background: var(--paper-2); }
  }
</style>
</head>
<body>
<div class="app">

  <header class="hdr">
    <div class="brand">
      <div class="glyph">
        <canvas class="logo-cycle" data-src="neonic.neonic.png"></canvas>
      </div>
      <div>
        <div class="wordmark">neonic</div>
        <div class="tag">Hand drawn palette cycling PNGs</div>
      </div>
    </div>
    <div class="hdr-mid"><span>animate your imagination</span></div>
    <div class="hdr-r">
      <a class="btn ghost" href="https://inwordsandpictures.com/neonic">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="width:14px;height:14px"><path d="M4 19.5A2.5 2.5 0 016.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 014 19.5v-15A2.5 2.5 0 016.5 2z"/></svg>
        How it works
      </a>
    </div>
  </header>

  <main class="grid">

    <!-- Panel 1: Sketch it -->
    <section class="panel">
      <div class="panel-hd">
        <div class="panel-hd-l">
          <div class="step s1">1</div>
          <h2 class="h2">Sketch it</h2>
        </div>
        <div class="panel-hd-r">
          <button class="btn primary" id="import">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="width:14px;height:14px"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
            Import
          </button>
        </div>
      </div>
      <div class="panel-body">
        <div class="canvas-wrap"><canvas id="draw"></canvas></div>
      </div>
      <div class="panel-foot">
        <button class="chip" id="clear">Clear</button>
        <div style="flex:1"></div>
        <div class="slider-row">
          <label for="strokeW">Stroke</label>
          <input id="strokeW" class="nslider" type="range" min="6" max="64" value="11" />
          <span class="val" id="strokeW-val">11</span>
        </div>
        <div class="slider-row" title="0 = uniform width; 1 = max speed-based variation">
          <label for="thinning">Thin</label>
