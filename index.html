<script type="module">
import { getStroke, getStrokePoints } from './perfect-freehand.mjs';

const $ = (id) => document.getElementById(id);
const hex = (h) => { const n = parseInt(h.slice(1), 16); return [(n>>16)&255,(n>>8)&255,n&255]; };

// ─── Built-in palette presets ────────────────────────────────────────────
// These are editor data, not engine data — the engine knows how to cycle a
// ramp, not how to name one. Embed-time playback reads palette stops from
// PNG metadata; these named stops only seed the editor's preset dropdown.
const PALETTE_STOPS = {
  greyscale: [
    {t:0,color:hex('#0a0a0b')},{t:1,color:hex('#f5f3ec')},
  ],
  sodium: [
    {t:0,color:hex('#1a0a02')},{t:.45,color:hex('#a5410a')},
    {t:.78,color:hex('#ffb24a')},{t:1,color:hex('#fff7d6')},
  ],
  cyan: [
    {t:0,color:hex('#03070d')},{t:.72,color:hex('#3fb6e6')},
    {t:1,color:hex('#eaf6ff')},
  ],
  plasma: [
    {t:0,color:hex('#0d0420')},{t:.55,color:hex('#c2317a')},
    {t:.78,color:hex('#f08a3a')},{t:1,color:hex('#fff2cf')},
  ],
  rainbow: [
    {t:0.00,color:hex('#1f7bff')},{t:0.17,color:hex('#7b2dff')},
    {t:0.34,color:hex('#ff2a2a')},{t:0.50,color:hex('#ff8a14')},
    {t:0.67,color:hex('#ffe600')},{t:0.83,color:hex('#2dd24a')},
    {t:1.00,color:hex('#1f7bff')},
  ],
  // Compressed rainbow: long blue floor with a narrow rainbow band
  // around t=0.5. Mirrors the regular rainbow's leading purple
  // (blue→purple→red...) with the purple stop right before red, plus
  // the existing purple after the band so the cycle reads symmetric.
  rainbowCompressed: (() => {
    const blue = hex('#1f7bff');
    return [
      {t:0.000,color:blue},{t:0.449,color:blue},
      {t:0.4495,color:hex('#7b2dff')},
      {t:0.450,color:hex('#ff2a2a')},{t:0.467,color:hex('#ff8a14')},
      {t:0.484,color:hex('#ffe600')},{t:0.500,color:hex('#2dd24a')},
      {t:0.517,color:hex('#1f7bff')},{t:0.534,color:hex('#7b2dff')},
      {t:0.550,color:blue},{t:1.000,color:blue},
    ];
  })(),
};

// ─── State ───────────────────────────────────────────────────────────────
const state = { paths: [] };
let liveStroke = null;
let rawLiveStroke = null;
let liveStrokeType = 'mouse';   // 'pen' uses real pressure; mouse/finger triggers PF's simulator
let smoothLevel = 1.5;
let currentRamp = null;
let selectedStop = -1;

let activeDrag = null;
let renderRaf = 0;
let bakeTimer = 0;
let engine = null;
let dpr = window.devicePixelRatio || 1;
const undoHistory = [];
const redoHistory = [];

// Playlist
const playlist = [];        // [{ name, stops, speed, cycles }]
let activeIdx = -1;         // editor's selected entry; -1 = scratch (no playlist)
let displayedIdx = -1;      // engine's currently-playing entry
let pendingNextIdx = -1;    // queued next-displayed during a transition
let targetCycles = 1;

// ─── DOM refs ────────────────────────────────────────────────────────────
const drawCvs    = $('draw');
const bezCvs     = $('bezier');
const outCvs     = $('out');
const strokeWIn  = $('strokeW');
const strokeWVal = $('strokeW-val');
const thinningIn = $('thinning');
const thinningVal = $('thinning-val');
const bakeMeta   = $('bake-meta');
const bezMeta    = $('bez-meta');

const dctx = drawCvs.getContext('2d');
const bctx = bezCvs.getContext('2d');

// ─── Geometry ────────────────────────────────────────────────────────────
function eventToCanvasPoint(e, canvas) {
  const r = canvas.getBoundingClientRect();
  // Pen input reports real pressure (and may legitimately be 0 with a
  // very light contact). Mouse / finger have no pressure data, so we
  // substitute 0.5 — PF's velocity simulator picks up the work from
  // there. Without this guard, `e.pressure || 0.5` collapses real
  // 0-pressure samples to 0.5 and masks the start of an Apple Pencil
  // stroke as "neutral".
  const isPen = e.pointerType === 'pen';
  const pressure = isPen ? (e.pressure ?? 0) : (e.pressure || 0.5);
  return {
    x: e.clientX - r.left,
    y: e.clientY - r.top,
    pressure,
  };
}

function rdpSimplify(points, eps) {
  if (points.length < 3) return points.slice();
  const sqEps = eps * eps;
  const keep = new Uint8Array(points.length);
  keep[0] = 1; keep[points.length - 1] = 1;
  const stack = [[0, points.length - 1]];
  while (stack.length) {
    const [lo, hi] = stack.pop();
    let maxSqD = 0, idx = -1;
    const a = points[lo], b = points[hi];
    const dx = b.x - a.x, dy = b.y - a.y;
    const len2 = dx*dx + dy*dy || 1;
    for (let i = lo + 1; i < hi; i++) {
      const px = points[i].x - a.x, py = points[i].y - a.y;
      const t = (px*dx + py*dy) / len2;
      const cx = a.x + t*dx, cy = a.y + t*dy;
      const ex = points[i].x - cx, ey = points[i].y - cy;
      const sq = ex*ex + ey*ey;
      if (sq > maxSqD) { maxSqD = sq; idx = i; }
    }
    if (maxSqD > sqEps && idx > 0) {
      keep[idx] = 1;
      stack.push([lo, idx], [idx, hi]);
    }
  }
  const out = [];
  for (let i = 0; i < points.length; i++) if (keep[i]) out.push(points[i]);
  return out;
}

function polylineToBezier(points) {
  const n = points.length;
  if (n < 2) return null;
  const a = new Array(n);
  for (let i = 0; i < n; i++) {
    const p = points[i];
    const prev = points[i - 1] || p;
    const next = points[i + 1] || p;
    const tx = (next.x - prev.x) / 6;
    const ty = (next.y - prev.y) / 6;
    // Anchors carry both `pressure` (the source of truth — preserved
    // across thinning changes) and `width` (the cached display value
    // derived from pressure × path.size × thinning formula).
    const pressure = p.pressure != null ? p.pressure : 0.5;
    const w = p.width != null ? p.width
            : 22 * (0.6 + 0.8 * pressure);
    a[i] = {
      x: p.x, y: p.y,
      h1x: p.x - tx, h1y: p.y - ty,
      h2x: p.x + tx, h2y: p.y + ty,
      width: w,
      pressure,
    };
  }
  return { anchors: a };
}

function bezierPoint(p, q, t) {
  const u = 1 - t;
  return {
    x: u*u*u*p.x + 3*u*u*t*p.h2x + 3*u*t*t*q.h1x + t*t*t*q.x,
    y: u*u*u*p.y + 3*u*u*t*p.h2y + 3*u*t*t*q.h1y + t*t*t*q.y,
  };
}
function samplePath(path, perSeg) {
  const a = path.anchors;
  if (a.length < 2) return [];
  const widthOf = (anchor) => (anchor.width == null ? 22 : anchor.width);
  const pressureOf = (anchor) => (anchor.pressure == null ? 0.5 : anchor.pressure);
  const out = [{
    x: a[0].x, y: a[0].y,
    width: widthOf(a[0]), pressure: pressureOf(a[0]),
  }];
  for (let i = 1; i < a.length; i++) {
    const p = a[i-1], q = a[i];
    const pw = widthOf(p), qw = widthOf(q);
    const pp = pressureOf(p), qp = pressureOf(q);
    for (let k = 1; k <= perSeg; k++) {
      const t = k / perSeg;
      const pt = bezierPoint(p, q, t);
      pt.width = pw + (qw - pw) * t;
      pt.pressure = pp + (qp - pp) * t;
      out.push(pt);
    }
  }
  return out;
}
function pathToD(path) {
  const a = path.anchors;
  if (a.length < 2) return '';
  const f = (n) => n.toFixed(1);
  let d = `M${f(a[0].x)},${f(a[0].y)}`;
  for (let i = 1; i < a.length; i++) {
    const p = a[i-1], q = a[i];
    d += `C${f(p.h2x)},${f(p.h2y)} ${f(q.h1x)},${f(q.h1y)} ${f(q.x)},${f(q.y)}`;
  }
  return d;
}

// ─── Render ──────────────────────────────────────────────────────────────
function fitCanvas(canvas, ctx) {
  const cssW = canvas.clientWidth;
  const cssH = canvas.clientHeight;
  if (!cssW || !cssH) return false;
  const W = Math.round(cssW * dpr);
  const H = Math.round(cssH * dpr);
  if (canvas.width !== W || canvas.height !== H) {
    canvas.width = W;
    canvas.height = H;
  }
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  return true;
}

function fillPolygon(ctx, pts, fill) {
  if (pts.length < 3) return;
  ctx.fillStyle = fill;
  ctx.beginPath();
  ctx.moveTo(pts[0][0], pts[0][1]);
  for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]);
  ctx.closePath();
  ctx.fill();
}

// Read CSS variables so canvas-painted strokes follow the page theme.
function getInk()   { return getComputedStyle(document.documentElement).getPropertyValue('--ink').trim()   || '#15151a'; }
function getMuted() { return getComputedStyle(document.documentElement).getPropertyValue('--muted').trim() || '#6b6963'; }

// Replicates perfect-freehand's iterative simulatePressure (it's a
// no-op as a parameter to getStrokePoints — the flag actually lives
// on getStrokeOutlinePoints, applied locally inside the outline
// builder without mutating the input). For each centerline point,
// V advances via the same step PF uses internally:
//   ratio = min(1, distance/size)
//   target = min(1, 1 - ratio)
//   V_next = min(1, V + (target - V) * ratio * 0.275)
// V seeds from the average of the first 10 simulated pressures. The
// per-point V is iterative — sustained fast strokes drift toward 0,
// sustained slow toward 1. That's what gives PF its dynamic range.
function pfSimulatePressure(strokePoints, size) {
  if (!strokePoints.length) return strokePoints;
  const step = (prev, distance) => {
    const r = Math.min(1, distance / size);
    const target = Math.min(1, 1 - r);
    return Math.min(1, prev + (target - prev) * (r * 0.275));
  };
  let seed = strokePoints[0].pressure;
  const limit = Math.min(10, strokePoints.length);
  for (let i = 0; i < limit; i++) {
    const sim = step(seed, strokePoints[i].distance);
    seed = (seed + sim) / 2;
  }
  let V = seed;
  return strokePoints.map((p) => {
    V = step(V, p.distance);
    return { point: p.point, distance: p.distance, pressure: V };
  });
}

// Process a freshly-drawn raw stroke into {x, y, pressure, width}[]
// suitable for polylineToBezier. PF's thinning formula is:
//   width = size * (1 - thinning + 2 * thinning * pressure)
// thinning=0 → uniform; thinning=0.4 (PF's historical default) reduces
// to size*(0.6 + 0.8*pressure); thinning=1 swings 0..2*size.
//
// simulate=true: input pressures are flat 0.5 (mouse / finger), so we
// run PF's iterative velocity simulator to derive pressures.
// simulate=false: input pressures are real (pen), so we keep them.
function processRawStroke(rawStroke, size, thinning, simulate) {
  const flat = rawStroke.map(p => [p.x, p.y, p.pressure]);
  const sp = getStrokePoints(flat, { size, streamline: 0.5, last: true });
  if (sp.length < 2) return [];
  const adjusted = simulate ? pfSimulatePressure(sp, size) : sp;
  return adjusted.map(p => ({
    x: p.point[0],
    y: p.point[1],
    pressure: p.pressure,
    width: Math.max(0.5, size * (1 - thinning + 2 * thinning * p.pressure)),
  }));
}

function drawDrawingPanel() {
  if (!fitCanvas(drawCvs, dctx)) return;
  const cssW = drawCvs.clientWidth, cssH = drawCvs.clientHeight;
  dctx.clearRect(0, 0, cssW, cssH);

  const inkColor = getInk();

  if (rawLiveStroke && rawLiveStroke.length >= 1) {
    // Live drag: PF outline polygon. simulatePressure is OFF for pen
    // (use real per-point pressure) and ON for mouse / finger (where
    // input is flat 0.5 and PF's velocity simulator does the work).
    const w = +strokeWIn.value;
    const opts = {
      size: w,
      thinning: +thinningIn.value,
      smoothing: 0.55,
      streamline: 0.5,
      simulatePressure: liveStrokeType !== 'pen',
    };
    const flat = rawLiveStroke.map(p => [p.x, p.y, p.pressure]);
    const outline = getStroke(flat, { ...opts, last: !activeDrag });
    fillPolygon(dctx, outline, inkColor);
  } else if (state.paths.length > 0 && state.paths[0].anchors.length >= 2) {
    // Post-draw / after edits: disc-stamp the bezier with anchor
    // widths. Same algorithm panel 4's bake uses, so the two panels
    // always agree.
    const samples = samplePath(state.paths[0], 60);
    dctx.fillStyle = inkColor;
    for (const p of samples) {
      const r = Math.max(0.5, p.width / 2);
      dctx.beginPath();
      dctx.arc(p.x, p.y, r, 0, Math.PI * 2);
      dctx.fill();
    }
  } else {
    dctx.fillStyle = getMuted();
    dctx.globalAlpha = 0.7;
    dctx.font = '14px ui-sans-serif, system-ui, sans-serif';
    dctx.fillText('draw a stroke', 16, 26);
    dctx.globalAlpha = 1;
  }
}

// Logical → CSS-coords transform for panel 2. Two modes:
//   bezierManualView === null  → recompute from path bbox each frame
//                                (auto-fit, never zooms past 1×).
//   bezierManualView is set    → use it as-is. The user has explicitly
//                                zoomed or panned and we don't fight them.
// "fit" button resets to null. New draw / Clear also reset.
let bezierViewT = { scale: 1, tx: 0, ty: 0 };
let bezierManualView = null;

function computeBezierViewT(cssW, cssH) {
  if (bezierManualView) {
    bezierViewT = { ...bezierManualView };
    return;
  }
  if (state.paths.length === 0) {
    bezierViewT = { scale: 1, tx: 0, ty: 0 };
    return;
  }
  let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
  for (const path of state.paths) {
    for (const a of path.anchors) {
      const wh = widthHandlePos(a);
      const xs = [a.x, a.h1x, a.h2x, wh.x];
      const ys = [a.y, a.h1y, a.h2y, wh.y];
      for (const x of xs) { if (x < minX) minX = x; if (x > maxX) maxX = x; }
      for (const y of ys) { if (y < minY) minY = y; if (y > maxY) maxY = y; }
    }
  }
  const pad = 28;
  const contentW = Math.max(1, maxX - minX);
  const contentH = Math.max(1, maxY - minY);
  const fitW = cssW - 2 * pad;
  const fitH = cssH - 2 * pad;
  // Don't zoom in beyond 1× — small drawings stay at native size and
  // are centered. Zoom out only when the content would clip.
  const scale = Math.min(1, fitW / contentW, fitH / contentH);
  const tx = pad + (fitW - contentW * scale) / 2 - minX * scale;
  const ty = pad + (fitH - contentH * scale) / 2 - minY * scale;
  bezierViewT = { scale, tx, ty };
}

// Switch into manual-view mode if not already there. Seeds with the
// current auto-fit transform so the first manipulation isn't a jump.
function ensureManualView() {
  if (!bezierManualView) {
    bezierManualView = { ...bezierViewT };
  }
  return bezierManualView;
}

// Zoom centred on a CSS-coord point, preserving the logical point
// under the cursor. Solving for the new tx/ty:
//   logical = (cssX - tx) / scale
//   newCss  = logical * newScale + newTx        (= cssX, by construction)
function zoomAt(cssX, cssY, factor) {
  const v = ensureManualView();
  const logicalX = (cssX - v.tx) / v.scale;
  const logicalY = (cssY - v.ty) / v.scale;
  v.scale = Math.max(0.1, Math.min(10, v.scale * factor));
  v.tx = cssX - logicalX * v.scale;
  v.ty = cssY - logicalY * v.scale;
  scheduleRender();
}

function pointerToLogical(clientX, clientY) {
  const r = bezCvs.getBoundingClientRect();
  const cssX = clientX - r.left;
  const cssY = clientY - r.top;
  return {
    x: (cssX - bezierViewT.tx) / bezierViewT.scale,
    y: (cssY - bezierViewT.ty) / bezierViewT.scale,
  };
}

function drawBezierPanel() {
  if (!fitCanvas(bezCvs, bctx)) return;
  const cssW = bezCvs.clientWidth, cssH = bezCvs.clientHeight;
  bctx.clearRect(0, 0, cssW, cssH);

  if (state.paths.length === 0) {
    bezierViewT = { scale: 1, tx: 0, ty: 0 };
    bctx.fillStyle = getMuted();
    bctx.globalAlpha = 0.7;
    bctx.font = '14px ui-sans-serif, system-ui, sans-serif';
    bctx.fillText('draw a stroke first', 16, 26);
    bctx.globalAlpha = 1;
    // Reflect the empty state in bez-meta — otherwise the stale count
    // from the last render lingers and surprises anything that reads it
    // (e.g. an undo test that expects 0 anchors).
    bezMeta.textContent = '0 anchors';
    return;
  }

  computeBezierViewT(cssW, cssH);
  const T = bezierViewT;
  const proj = (x, y) => [x * T.scale + T.tx, y * T.scale + T.ty];

  const inkColor = getInk();
  for (const path of state.paths) {
    const a = path.anchors;
    bctx.strokeStyle = inkColor;
    bctx.lineWidth = 1.5;
    bctx.beginPath();
    const [x0, y0] = proj(a[0].x, a[0].y);
    bctx.moveTo(x0, y0);
    for (let i = 1; i < a.length; i++) {
      const p = a[i-1], q = a[i];
      const [c1x, c1y] = proj(p.h2x, p.h2y);
      const [c2x, c2y] = proj(q.h1x, q.h1y);
      const [x1, y1] = proj(q.x, q.y);
      bctx.bezierCurveTo(c1x, c1y, c2x, c2y, x1, y1);
    }
    bctx.stroke();

    for (let i = 0; i < a.length; i++) {
      const [ax, ay] = proj(a[i].x, a[i].y);
      if (i > 0) {
        const [hx, hy] = proj(a[i].h1x, a[i].h1y);
        drawHandle(ax, ay, hx, hy);
      }
      if (i < a.length - 1) {
        const [hx, hy] = proj(a[i].h2x, a[i].h2y);
        drawHandle(ax, ay, hx, hy);
      }
    }
    for (let i = 0; i < a.length; i++) {
      const wh = widthHandlePos(a[i]);
      const [ax, ay] = proj(a[i].x, a[i].y);
      const [hx, hy] = proj(wh.x, wh.y);
      drawWidthHandle(ax, ay, hx, hy);
    }
    for (let i = 0; i < a.length; i++) {
      const [ax, ay] = proj(a[i].x, a[i].y);
      drawAnchor(ax, ay);
    }
  }

  const totalAnchors = state.paths.reduce((n, p) => n + p.anchors.length, 0);
  const zoomNote = Math.abs(T.scale - 1) > 0.005
    ? ` · ${(T.scale * 100).toFixed(0)}%`
    : '';
  bezMeta.textContent = `${totalAnchors} anchors${zoomNote}`;
  // Mirror live zoom into the chip-input (skipped while the user is
  // typing into it, so we don't fight their edit mid-keystroke).
  const zv = document.getElementById('zoom-val');
  if (zv && document.activeElement !== zv) {
    zv.value = `${(T.scale * 100).toFixed(0)}%`;
  }
}

// Recompute every anchor's display width from its pressure given the
// path's base size and the current thinning. Called whenever thinning
// or the stroke slider moves.
function recomputeWidths(path, thinning) {
  const size = path.size || 22;
  for (const a of path.anchors) {
    const p = a.pressure == null ? 0.5 : a.pressure;
    a.width = Math.max(0.5, size * (1 - thinning + 2 * thinning * p));
  }
}

// Compute the perpendicular axis at an anchor (from h1→h2 tangent),
// and the width handle's position offset along it by 2× the width
// (1 px of drag = 0.5 px of width change — sits well outside the
// stroke at typical sizes so the handle is easy to grab).
function widthHandlePos(anchor) {
  const w = anchor.width == null ? 22 : anchor.width;
  let tx = anchor.h2x - anchor.h1x;
  let ty = anchor.h2y - anchor.h1y;
  const len = Math.hypot(tx, ty) || 1;
  tx /= len; ty /= len;
  const px = -ty, py = tx;   // perpendicular: 90° CCW
  return {
    x: anchor.x + px * w * 2,
    y: anchor.y + py * w * 2,
    perpX: px, perpY: py,
  };
}

function drawHandle(ax, ay, hx, hy) {
  bctx.strokeStyle = 'rgba(31,123,255,0.45)';
  bctx.lineWidth = 1;
  bctx.beginPath();
  bctx.moveTo(ax, ay); bctx.lineTo(hx, hy);
  bctx.stroke();
  bctx.fillStyle = '#fff';
  bctx.strokeStyle = '#1f7bff';
  bctx.lineWidth = 1.2;
  bctx.beginPath();
  bctx.rect(hx - 3.5, hy - 3.5, 7, 7);
  bctx.fill(); bctx.stroke();
}
function drawWidthHandle(ax, ay, hx, hy) {
  bctx.strokeStyle = 'rgba(255,138,20,0.45)';
  bctx.lineWidth = 1;
  bctx.setLineDash([2, 2]);
  bctx.beginPath();
  bctx.moveTo(ax, ay); bctx.lineTo(hx, hy);
  bctx.stroke();
  bctx.setLineDash([]);
  bctx.fillStyle = '#fff';
  bctx.strokeStyle = '#ff8a14';
  bctx.lineWidth = 1.2;
  bctx.beginPath();
  bctx.rect(hx - 3.5, hy - 3.5, 7, 7);
  bctx.fill(); bctx.stroke();
}
function drawAnchor(x, y) {
  bctx.fillStyle = '#1f7bff';
  bctx.strokeStyle = '#fff';
  bctx.lineWidth = 1.5;
  bctx.beginPath();
  bctx.arc(x, y, 4.5, 0, Math.PI * 2);
  bctx.fill(); bctx.stroke();
}

function scheduleRender() {
  if (renderRaf) return;
  renderRaf = requestAnimationFrame(() => {
    renderRaf = 0;
    drawDrawingPanel();
    drawBezierPanel();
  });
}

// ─── Pointer routing ─────────────────────────────────────────────────────
drawCvs.addEventListener('pointerdown', (e) => {
  e.preventDefault();
  pushHistory();
  state.paths = [];
  liveStrokeType = e.pointerType || 'mouse';
  rawLiveStroke = [eventToCanvasPoint(e, drawCvs)];
  activeDrag = { kind: 'draw' };
  // Fresh stroke → drop any manual zoom/pan so panel 2 reframes the
  // new path automatically.
  bezierManualView = null;
  scheduleRender();
});

// Tap-mode dropdown — drives the pointerdown action when no modifier
// keys are held. Cmd/Ctrl-click and shift-click stay as desktop
// accelerators that override whatever mode is selected.
let bezierMode = 'drag';
$('bezierMode').addEventListener('change', (e) => {
  bezierMode = e.target.value;
  bezCvs.classList.toggle('pan-mode', bezierMode === 'pan');
});

// Wheel = zoom centred on cursor. Trackpad two-finger drag also fires
// wheel events; treating both as zoom is fine because pan has its own
// dedicated mode + middle-click affordance.
bezCvs.addEventListener('wheel', (e) => {
  e.preventDefault();
  const r = bezCvs.getBoundingClientRect();
  const cssX = e.clientX - r.left;
  const cssY = e.clientY - r.top;
  // exp(-deltaY/200) → smooth zoom that handles fast trackpad scrolls
  // without clamping. Negate so scrolling up zooms in.
  const factor = Math.exp(-e.deltaY / 200);
  zoomAt(cssX, cssY, factor);
}, { passive: false });

$('zoomIn').addEventListener('click', () => {
  zoomAt(bezCvs.clientWidth / 2, bezCvs.clientHeight / 2, 1.5);
});
$('zoomOut').addEventListener('click', () => {
  zoomAt(bezCvs.clientWidth / 2, bezCvs.clientHeight / 2, 1 / 1.5);
});
$('zoomFit').addEventListener('click', () => {
  bezierManualView = null;
  scheduleRender();
});

// The "null action" in panel 2 is pan. Click-and-drag in empty space
// pans the view regardless of the chosen tap-mode; the explicit pan
// mode just forces panning even when the cursor IS over an anchor or
// curve (useful when the canvas is densely packed and there's no
// blank spot to grab).
function startBezierPan(e) {
  ensureManualView();
  activeDrag = {
    kind: 'pan',
    startCssX: e.clientX,
    startCssY: e.clientY,
    startTx: bezierManualView.tx,
    startTy: bezierManualView.ty,
  };
  bezCvs.classList.add('panning');
}

bezCvs.addEventListener('pointerdown', (e) => {
  e.preventDefault();

  // Middle-click is always pan; explicit pan mode is always pan.
  if (e.button === 1 || bezierMode === 'pan') {
    startBezierPan(e);
    return;
  }

  const { x, y } = pointerToLogical(e.clientX, e.clientY);
  const wantRemove = e.ctrlKey || e.metaKey || bezierMode === 'remove';
  const wantAdd = e.shiftKey || bezierMode === 'add';

  if (wantRemove) {
    const hit = bezierHitTest(x, y);
    if (hit && hit.sub === 'anchor'
        && state.paths[hit.pi].anchors.length > 2) {
      pushHistory();
      state.paths[hit.pi].anchors.splice(hit.ai, 1);
      scheduleRender();
      scheduleBake();
      return;
    }
    // Empty space in remove mode → pan rather than do nothing.
    startBezierPan(e);
    return;
  }

  if (wantAdd && state.paths.length > 0) {
    // de Casteljau split at the closest point along the curve —
    // tangents on both sides keep their existing shape.
    const closest = closestPointOnPath(state.paths[0], x, y, 12);
    if (closest) {
      pushHistory();
      splitBezierAt(state.paths[0], closest.segIdx, closest.t);
      scheduleRender();
      scheduleBake();
      return;
    }
    // No curve nearby → pan.
    startBezierPan(e);
    return;
  }

  // Drag mode (default): grab the anchor/handle under the cursor, or
  // fall through to pan when nothing's there.
  const hit = bezierHitTest(x, y);
  if (hit) {
    pushHistory();
    activeDrag = { kind: 'bezier', ...hit };
    return;
  }
  startBezierPan(e);
});

function closestPointOnPath(path, x, y, maxDist) {
  const a = path.anchors;
  // Threshold is in screen px; scale to logical units so hits stay
  // tactile when the view is zoomed out.
  const max = (maxDist || 12) / bezierViewT.scale;
  let best = null, bestD2 = max * max;
  const STEPS = 24;
  for (let i = 0; i < a.length - 1; i++) {
    const p = a[i], q = a[i + 1];
    for (let s = 1; s < STEPS; s++) {
      const t = s / STEPS;
      const pt = bezierPoint(p, q, t);
      const dx = pt.x - x, dy = pt.y - y;
      const d2 = dx * dx + dy * dy;
      if (d2 < bestD2) { bestD2 = d2; best = { segIdx: i, t }; }
    }
  }
  return best;
}

// de Casteljau split of segment segIdx at parameter t. Inserts the
// resulting subdivision point as a new anchor; updates the existing
// neighbouring anchors' inner handles so the curve shape is preserved
// exactly through the split.
function splitBezierAt(path, segIdx, t) {
  const a = path.anchors;
  const lerp = (p, q) => ({ x: p.x + (q.x - p.x) * t, y: p.y + (q.y - p.y) * t });
  const P0 = { x: a[segIdx].x,        y: a[segIdx].y };
  const P1 = { x: a[segIdx].h2x,      y: a[segIdx].h2y };
  const P2 = { x: a[segIdx + 1].h1x,  y: a[segIdx + 1].h1y };
  const P3 = { x: a[segIdx + 1].x,    y: a[segIdx + 1].y };
  const A = lerp(P0, P1);
  const B = lerp(P1, P2);
  const C = lerp(P2, P3);
  const D = lerp(A, B);
  const E = lerp(B, C);
  const F = lerp(D, E);
  a[segIdx].h2x = A.x;       a[segIdx].h2y = A.y;
  a[segIdx + 1].h1x = C.x;   a[segIdx + 1].h1y = C.y;
  const wa = a[segIdx].width == null ? 22 : a[segIdx].width;
  const wb = a[segIdx + 1].width == null ? 22 : a[segIdx + 1].width;
  const pa = a[segIdx].pressure == null ? 0.5 : a[segIdx].pressure;
  const pb = a[segIdx + 1].pressure == null ? 0.5 : a[segIdx + 1].pressure;
  a.splice(segIdx + 1, 0, {
    x: F.x, y: F.y,
    h1x: D.x, h1y: D.y,
    h2x: E.x, h2y: E.y,
    width: wa + (wb - wa) * t,
    pressure: pa + (pb - pa) * t,
  });
}

// Drawer ramp pointerdown is wired up in renderPlaylist (the canvases
// are dynamic, one per drawer row).

window.addEventListener('pointermove', (e) => {
  if (!activeDrag) return;
  if (activeDrag.kind === 'draw') {
    const p = eventToCanvasPoint(e, drawCvs);
    const last = rawLiveStroke[rawLiveStroke.length - 1];
    const dx = p.x - last.x, dy = p.y - last.y;
    if (dx*dx + dy*dy < 4) return;
    rawLiveStroke.push(p);
    scheduleRender();
  } else if (activeDrag.kind === 'bezier') {
    const { x, y } = pointerToLogical(e.clientX, e.clientY);
    const a = state.paths[activeDrag.pi].anchors[activeDrag.ai];
    if (activeDrag.sub === 'anchor') {
      const dx = x - a.x, dy = y - a.y;
      a.x = x; a.y = y;
      a.h1x += dx; a.h1y += dy;
      a.h2x += dx; a.h2y += dy;
    } else if (activeDrag.sub === 'h1') {
      a.h1x = x; a.h1y = y;
    } else if (activeDrag.sub === 'h2') {
      a.h2x = x; a.h2y = y;
    } else if (activeDrag.sub === 'width') {
      // Project the pointer onto the local perpendicular axis. Handle
      // sits at 2× width from the anchor (see widthHandlePos), so the
      // new width is |projection| / 2.
      const wh = widthHandlePos(a);
      const proj = (x - a.x) * wh.perpX + (y - a.y) * wh.perpY;
      const newWidth = Math.max(2, Math.min(200, Math.abs(proj) / 2));
      a.width = newWidth;
      // Invert the thinning formula so the explicit width survives
      // future thinning changes. At thinning≈0 the formula is
      // degenerate (width = size for any pressure), so the drag
      // persists only until the next thinning / stroke-slider tweak —
      // acceptable since uniform widths can't carry per-anchor variation.
      const path = state.paths[activeDrag.pi];
      const size = path.size || 22;
      const thinning = +thinningIn.value;
      if (thinning > 0.001) {
        a.pressure = (newWidth / size - (1 - thinning)) / (2 * thinning);
      }
    }
    scheduleRender();
    scheduleBake();
  } else if (activeDrag.kind === 'ramp') {
    const row = $('playlist').children[activeDrag.idx];
    if (!row) return;
    const cvs = row.querySelector('.drawer-ramp');
    if (!cvs) return;
    const r = cvs.getBoundingClientRect();
    const cssW = cvs.clientWidth || 1;
    const t = Math.max(0, Math.min(1, 1 - (e.clientX - r.left) / cssW));
    playlist[activeDrag.idx].stops[activeDrag.stopIdx].t = t;
    rebuildRamp();
  } else if (activeDrag.kind === 'pan') {
    const dx = e.clientX - activeDrag.startCssX;
    const dy = e.clientY - activeDrag.startCssY;
    bezierManualView.tx = activeDrag.startTx + dx;
    bezierManualView.ty = activeDrag.startTy + dy;
    scheduleRender();
  }
});

window.addEventListener('pointerup', () => {
  if (!activeDrag) return;
  const drag = activeDrag;
  activeDrag = null;
  if (drag.kind === 'draw') {
    if (rawLiveStroke && rawLiveStroke.length >= 2) {
      // Run PF's pipeline (getStrokePoints + iterative simulatePressure)
      // and convert pressure → absolute pixel width using PF's thinning
      // formula. The bezier anchors carry widths from here on; the
      // raw input is discarded.
      const size = +strokeWIn.value;
      const thinning = +thinningIn.value;
      const simulate = liveStrokeType !== 'pen';
      const processed = processRawStroke(rawLiveStroke, size, thinning, simulate);
      smoothLevel = 1.5;
      const path = polylineToBezier(rdpSimplify(processed, smoothLevel));
      if (path) {
        path.size = size;   // base size for thinning / stroke-slider recompute
        state.paths = [path];
      }
    }
    rawLiveStroke = null;
    scheduleRender();
    scheduleBake();
  } else if (drag.kind === 'bezier') {
    scheduleBake();
  } else if (drag.kind === 'ramp') {
    /* ramp drag is finalized by rebuildRamp on each move */
  } else if (drag.kind === 'pan') {
    bezCvs.classList.remove('panning');
  }
});

window.addEventListener('pointercancel', () => {
  if (activeDrag && activeDrag.kind === 'draw') {
    rawLiveStroke = null;
  }
  if (activeDrag && activeDrag.kind === 'pan') {
    bezCvs.classList.remove('panning');
  }
  activeDrag = null;
});

function bezierHitTest(x, y) {
  // 12px in screen space → scaled to logical units.
  let best = null, bestD = 12 / bezierViewT.scale;
  for (let pi = 0; pi < state.paths.length; pi++) {
    const a = state.paths[pi].anchors;
    for (let ai = 0; ai < a.length; ai++) {
      let d = Math.hypot(a[ai].x - x, a[ai].y - y);
      if (d < bestD) { best = { pi, ai, sub: 'anchor' }; bestD = d; }
      if (ai > 0) {
        d = Math.hypot(a[ai].h1x - x, a[ai].h1y - y);
        if (d < bestD) { best = { pi, ai, sub: 'h1' }; bestD = d; }
      }
      if (ai < a.length - 1) {
        d = Math.hypot(a[ai].h2x - x, a[ai].h2y - y);
        if (d < bestD) { best = { pi, ai, sub: 'h2' }; bestD = d; }
      }
      const wh = widthHandlePos(a[ai]);
      d = Math.hypot(wh.x - x, wh.y - y);
      if (d < bestD) { best = { pi, ai, sub: 'width' }; bestD = d; }
    }
  }
  return best;
}

// ─── Bake & engine ───────────────────────────────────────────────────────
function scheduleBake() {
  clearTimeout(bakeTimer);
  bakeTimer = setTimeout(rebake, 120);
}

function rebake() {
  if (state.paths.length === 0 || state.paths[0].anchors.length < 2) return;
  // Cap the bake's long edge so panel 4 stops growing once the
  // drawing exceeds its natural box. Below the cap, the historical
  // scale (1.6 with 24px padding) still applies; above it, scale
  // shrinks so the drawing fits — like panel 2's auto-fit.
  // paddingLogical = 24 / 1.6 = 15 (anchor-space units); padding
  // tracks scale so the visual margin proportion stays constant.
  const PANEL4_TARGET_LONG = 480;
  const DEFAULT_SCALE = 1.6;
  const PADDING_LOGICAL = 15;
  const stroke = samplePath(state.paths[0], 16);
  let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
  for (const p of stroke) {
    if (p.x < minX) minX = p.x; if (p.x > maxX) maxX = p.x;
    if (p.y < minY) minY = p.y; if (p.y > maxY) maxY = p.y;
  }
  const longBbox = Math.max(maxX - minX, maxY - minY);
  const fitScale = PANEL4_TARGET_LONG / Math.max(1, longBbox + 2 * PADDING_LOGICAL);
  const scale = Math.min(DEFAULT_SCALE, fitScale);
  const padding = Math.max(1, Math.round(PADDING_LOGICAL * scale));
  let baked;
  try {
    // Always bake from bezier samples with anchor widths. Panel 4
    // uses the same disc-stamping algorithm as panel 1.
    baked = window.Neonic.bakeFromStroke({
      stroke, scale, padding, half: 'full',
    });
  } catch (e) {
    bakeMeta.textContent = 'bake failed: ' + e.message;
    return;
  }

  const prev = engine
    ? { offset: engine.offset, baseStartOff: engine.baseStartOff,
        speed: engine.speed, running: engine.running,
        // Capture an in-flight transition (cross-fade between two
        // playlist entries) so it can resume on the new engine
        // instead of snapping mid-blend.
        nextPalette: engine.nextPalette,
        nextStartOff: engine.nextStartOff }
    : null;
  if (engine) engine.stop();

  engine = new window.Neonic.CycleEngine(outCvs, baked);
  attachCycleWatcher(engine);
  // First-bake palette: prefer the displayed playlist entry; fall back
  // to whatever the editor's currentRamp is (which the playlist init
  // also primes from playlist[0]).
  const seedRamp = (displayedIdx >= 0 && playlist[displayedIdx])
    ? window.Neonic.buildRamp(playlist[displayedIdx].stops)
    : currentRamp;
  engine.setPalette(seedRamp);
  if (prev) {
    // Preserve cycle phase: restore offset AND baseStartOff so the
    // watcher's cyclesPlayed = (offset - baseStartOff) / 255 stays
    // consistent across rebakes. Without baseStartOff, the watcher
    // sees a huge cycle count and fires immediate transitions, which
    // looks like a brief speed-up after every undo / handle drag.
    engine.offset = prev.offset;
    engine.baseStartOff = prev.baseStartOff;
    engine.setSpeed(prev.speed);
    // Re-queue the in-flight palette transition if there was one.
    // setPalette above cleared nextPalette/nextStartOff, so we
    // overwrite them after. _palDirty triggers a fresh palette table
    // write on the next frame.
    if (prev.nextPalette !== null) {
      engine.nextPalette = prev.nextPalette;
      engine.nextStartOff = prev.nextStartOff;
      engine._palDirty = true;
    }
    if (prev.running) engine.start();
  } else {
    const seedEntry = (displayedIdx >= 0) ? playlist[displayedIdx] : null;
    engine.setSpeed(seedEntry?.speed ?? 60);
    engine.start();
  }
  bakeMeta.textContent = `${baked.width}×${baked.height} · ${(baked.indices.byteLength/1024).toFixed(1)} KB`;
}

// ─── Palette presets ─────────────────────────────────────────────────────
// Saved presets ("seeds" in the legacy storage key) live in localStorage
// and merge with PALETTE_STOPS in every drawer's preset dropdown.
const PRESETS_KEY = 'neonic.seeds';
function loadCustomPresets() {
  try { return JSON.parse(localStorage.getItem(PRESETS_KEY) || '{}'); }
  catch { return {}; }
}
function saveCustomPresets(map) {
  localStorage.setItem(PRESETS_KEY, JSON.stringify(map));
}

// Build a fresh stops array from a preset name.
//   "rainbow" → the verbatim stops from PALETTE_STOPS
//   "custom:foo" → the verbatim saved stops from localStorage
// In both cases the result is a fresh copy so subsequent edits don't
// mutate the preset source.
function buildStopsFromPreset(name) {
  if (name && name.startsWith('custom:')) {
    const customs = loadCustomPresets();
    const stored = customs[name.slice(7)];
    if (!stored) return null;
    return stored.map(s => ({ t: s.t, color: s.color.slice() }));
  }
  const stops = PALETTE_STOPS[name];
  if (!stops) return null;
  return stops.map(s => ({ t: s.t, color: s.color.slice() }));
}

function rgbToHex([r, g, b]) {
  const h = (v) => v.toString(16).padStart(2, '0');
  return '#' + h(r) + h(g) + h(b);
}
function hexToRgb(hex) {
  const n = parseInt(hex.slice(1), 16);
  return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
}

// Paint a flat gradient swatch (used for the collapsed-row swatch and
// elsewhere where we just need the gradient with no stop markers).
function drawGradient(canvas, palStops) {
  const cssW = canvas.clientWidth || 280;
  const cssH = canvas.clientHeight || 22;
  canvas.width = Math.round(cssW * dpr);
  canvas.height = Math.round(cssH * dpr);
  const ctx = canvas.getContext('2d');
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const ramp = window.Neonic.buildRamp(palStops);
  for (let x = 0; x < cssW; x++) {
    const t = 1 - x / Math.max(1, cssW - 1);
    const idx = Math.min(254, Math.max(0, Math.round(t * 254)));
    const r = ramp[idx*3], g = ramp[idx*3+1], b = ramp[idx*3+2];
    ctx.fillStyle = `rgb(${r},${g},${b})`;
    ctx.fillRect(x, 0, 1, cssH);
  }
}

// Paint the drawer's tall ramp + stop circles.
function drawDrawerRampOnto(canvas, palStops) {
  const cssW = canvas.clientWidth || 600;
  const cssH = canvas.clientHeight || 78;
  canvas.width = Math.round(cssW * dpr);
  canvas.height = Math.round(cssH * dpr);
  const ctx = canvas.getContext('2d');
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const barH = cssH - 26;
  const ramp = window.Neonic.buildRamp(palStops);
  for (let x = 0; x < cssW; x++) {
    const t = 1 - x / Math.max(1, cssW - 1);
    const idx = Math.min(254, Math.max(0, Math.round(t * 254)));
    const r = ramp[idx*3], g = ramp[idx*3+1], b = ramp[idx*3+2];
    ctx.fillStyle = `rgb(${r},${g},${b})`;
    ctx.fillRect(x, 0, 1, barH);
  }
  ctx.strokeStyle = 'rgba(0,0,0,0.18)';
  ctx.lineWidth = 1;
  ctx.strokeRect(0.5, 0.5, cssW - 1, barH - 1);

  // Use --ink for the stop outline so it inverts with theme: dark stroke
  // on light bg, light stroke on dark bg. Without this, a black stop on
  // a black drawer canvas in dark mode disappears.
  const inkC = getComputedStyle(document.documentElement)
                 .getPropertyValue('--ink').trim() || '#1b1a17';
  const handleY = barH + 11;
  const sortedIdx = palStops
    .map((s, i) => ({ i, t: s.t }))
    .sort((a, b) => a.t - b.t)
    .map(o => o.i);
  for (const i of sortedIdx) {
    const s = palStops[i];
    const x = Math.max(7, Math.min(cssW - 7, (1 - s.t) * cssW));
    const sel = i === selectedStop;
    ctx.fillStyle = `rgb(${s.color[0]},${s.color[1]},${s.color[2]})`;
    ctx.strokeStyle = sel ? '#1f7bff' : inkC;
    ctx.lineWidth = sel ? 2 : 1;
    ctx.beginPath();
    ctx.arc(x, handleY, sel ? 8 : 5.5, 0, Math.PI * 2);
    ctx.fill(); ctx.stroke();
  }
}

function rampHandleHitTest(canvas, x, palStops) {
  const cssW = canvas.clientWidth;
  let best = -1, bestD = 14;
  for (let i = 0; i < palStops.length; i++) {
    const hx = Math.max(7, Math.min(cssW - 7, (1 - palStops[i].t) * cssW));
    const d = Math.abs(hx - x);
    if (d < bestD) { bestD = d; best = i; }
  }
  return best;
}

// Open-drawer-only helpers — only one drawer is open at a time, so the
// canvas/inputs/etc all bind to playlist[activeIdx].
function activeRow() {
  return activeIdx >= 0 ? $('playlist').children[activeIdx] : null;
}
function drawDrawerRamp() {
  const row = activeRow();
  if (!row) return;
  const cvs = row.querySelector('.drawer-ramp');
  if (cvs) drawDrawerRampOnto(cvs, playlist[activeIdx].stops);
}
function drawRowSwatch(idx) {
  if (idx < 0 || idx >= playlist.length) return;
  const row = $('playlist').children[idx];
  if (!row) return;
  const cvs = row.querySelector('.swatch');
  if (cvs) drawGradient(cvs, playlist[idx].stops);
}
function syncStopColorInput() {
  const row = activeRow();
  if (!row) return;
  const inp = row.querySelector('.stop-color');
  const s = playlist[activeIdx].stops[selectedStop];
  if (inp && s) inp.value = rgbToHex(s.color);
}
function syncRemoveStopBtn() {
  const row = activeRow();
  if (!row) return;
  const btn = row.querySelector('.remove-stop');
  if (btn) btn.disabled = playlist[activeIdx].stops.length <= 2;
}

// Recompute currentRamp and push to engine + UI.
function rebuildRamp() {
  if (activeIdx < 0) return;
  const palStops = playlist[activeIdx].stops;
  currentRamp = window.Neonic.buildRamp(palStops);
  // Live edits on the displayed palette flow into the engine so the
  // user sees their tweaks reflected immediately.
  if (engine && activeIdx === displayedIdx) engine.replacePalette(currentRamp);
  drawDrawerRamp();
  drawRowSwatch(activeIdx);
  syncStopColorInput();
  syncRemoveStopBtn();
}

// ─── Playlist ────────────────────────────────────────────────────────────
// activeIdx is the row whose drawer is open (-1 = nothing open).
// displayedIdx is the engine's currently-playing row (independent).
// Clicking a row only opens its drawer; it does NOT switch playback.
function setActive(idx) {
  if (idx === activeIdx) {
    closeDrawer();
    return;
  }
  if (idx < 0 || idx >= playlist.length) return;
  activeIdx = idx;
  selectedStop = 0;
  currentRamp = window.Neonic.buildRamp(playlist[idx].stops);
  applyOpenStateOnly();
  drawDrawerRamp();
  syncStopColorInput();
  syncRemoveStopBtn();

  // Smooth jump-to-play: queue this row as the next palette and start
  // the feed-in immediately. The watcher's existing pendingNextIdx
  // flow finalizes displayedIdx after the transition spreads through
  // the 254-tick band, and tweens speed during the transition.
  if (engine && idx !== displayedIdx && idx !== pendingNextIdx) {
    engine.transitionTo(
      window.Neonic.buildRamp(playlist[idx].stops),
      engine.offset);
    pendingNextIdx = idx;
  }
}

function closeDrawer() {
  activeIdx = -1;
  applyOpenStateOnly();
}

// Toggle the .open class without rebuilding DOM, so input focus and
// dropdown selection survive open/close transitions.
function applyOpenStateOnly() {
  const root = $('playlist');
  if (!root) return;
  for (const row of root.children) {
    row.classList.toggle('open', +row.dataset.idx === activeIdx);
  }
}

function updatePlayingMarker() {
  const root = $('playlist');
  if (!root) return;
  for (const row of root.children) {
    row.classList.toggle('playing', +row.dataset.idx === displayedIdx);
  }
}

function updatePaletteCount() {
  const n = playlist.length;
  $('palette-count').textContent = String(n);
  $('palette-count-s').textContent = n === 1 ? '' : 's';
}

function addToPlaylist() {
  // Adds a copy of the active palette (or the first one if nothing's
  // selected) and opens its drawer.
  pushHistory();
  const src = playlist[activeIdx >= 0 ? activeIdx : 0] || null;
  const copy = src
    ? src.stops.map(s => ({ t: s.t, color: s.color.slice() }))
    : [];
  playlist.push({
    stops: copy,
    speed: src ? src.speed : 60,
    cycles: 1,
  });
  renderPlaylist();
  setActive(playlist.length - 1);
}

function removePlaylistItem(idx) {
  if (idx < 0 || idx >= playlist.length) return;
  if (playlist.length <= 1) return;
  pushHistory();
  const wasActive = idx === activeIdx;
  const wasDisplayed = idx === displayedIdx;
  const wasPending = idx === pendingNextIdx;
  playlist.splice(idx, 1);
  if (wasActive) activeIdx = -1;
  else if (idx < activeIdx) activeIdx--;
  if (wasDisplayed) {
    displayedIdx = Math.min(idx, playlist.length - 1);
    pendingNextIdx = -1;
    const entry = playlist[displayedIdx];
    if (engine && entry) {
      engine.setPalette(window.Neonic.buildRamp(entry.stops));
      engine.setSpeed(entry.speed);
    }
    targetCycles = entry ? (entry.cycles || 1) : 1;
  } else if (idx < displayedIdx) {
    displayedIdx--;
  }
  // pendingNextIdx tracks a queued transition that hasn't promoted yet.
  // If the queued row is the one being deleted, drop the queue; if an
  // earlier row is deleted, shift the index down to keep pointing at
  // the same entry.
  if (wasPending) pendingNextIdx = -1;
  else if (pendingNextIdx >= 0 && idx < pendingNextIdx) pendingNextIdx--;
  renderPlaylist();
}

function reorderPlaylist(from, to) {
  if (from === to || from < 0 || to < 0) return;
  if (from >= playlist.length || to >= playlist.length) return;
  pushHistory();
  const moved = playlist.splice(from, 1)[0];
  playlist.splice(to, 0, moved);
  // Apply the same shift to activeIdx, displayedIdx, and pendingNextIdx
  // — the queued-next row needs to follow the entry it points at when
  // the playlist is reordered mid-transition.
  for (const ref of ['activeIdx', 'displayedIdx', 'pendingNextIdx']) {
    const cur = ref === 'activeIdx' ? activeIdx
              : ref === 'displayedIdx' ? displayedIdx
              : pendingNextIdx;
    let next = cur;
    if (cur === from) next = to;
    else if (from < cur && cur <= to) next = cur - 1;
    else if (to <= cur && cur < from) next = cur + 1;
    if (ref === 'activeIdx') activeIdx = next;
    else if (ref === 'displayedIdx') displayedIdx = next;
    else pendingNextIdx = next;
  }
  renderPlaylist();
}

// The editor uses the same playlist orchestrator as the embed-time
// loader (Neonic.attachPlaylistWatcher in the engine module). State
// lives in the editor's module globals; callbacks just bridge them.
// The watcher itself runs inside the engine's own _frame, so there's
// only one rAF loop and engine.stop() halts everything.
function attachCycleWatcher(eng) {
  window.Neonic.attachPlaylistWatcher(eng, {
    getPalettes: () => playlist,
    getActive:   () => displayedIdx,
    setActive:   (i) => { displayedIdx = i; },
    getPending:  () => pendingNextIdx,
    setPending:  (i) => { pendingNextIdx = i; },
    getTarget:   () => targetCycles,
    setTarget:   (n) => { targetCycles = n; },
    onPromote:   updatePlayingMarker,
  });
}

function buildPresetOptions(sel, currentName) {
  sel.innerHTML = '';
  const truncate = (s) => s.length > 17 ? s.slice(0, 17) + '…' : s;
  for (const name of Object.keys(PALETTE_STOPS)) {
    const o = document.createElement('option');
    o.value = name; o.textContent = truncate(name); o.title = name;
    sel.appendChild(o);
  }
  const customs = loadCustomPresets();
  const customNames = Object.keys(customs);
  if (customNames.length) {
    const sep = document.createElement('option');
    sep.disabled = true; sep.textContent = '── saved ──';
    sel.appendChild(sep);
    for (const n of customNames) {
      const o = document.createElement('option');
      o.value = 'custom:' + n; o.textContent = truncate(n); o.title = n;
      sel.appendChild(o);
    }
  }
  if (currentName && Array.from(sel.options).some(o => o.value === currentName && !o.disabled)) {
    sel.value = currentName;
  } else {
    sel.value = 'rainbow';
  }
}

function refreshAllPresetDropdowns() {
  const root = $('playlist');
  if (!root) return;
  for (const row of root.children) {
    const sel = row.querySelector('.preset-select');
    if (sel) buildPresetOptions(sel, sel.value);
  }
}

function renderPlaylist() {
  const root = $('playlist');
  root.innerHTML = '';
  updatePaletteCount();
  if (playlist.length === 0) return;

  for (let i = 0; i < playlist.length; i++) {
    const entry = playlist[i];
    const row = document.createElement('div');
    row.className = 'pal-row'
      + (i === activeIdx ? ' open' : '')
      + (i === displayedIdx ? ' playing' : '');
    row.dataset.idx = String(i);

    // ── Head ─────────────────────────────────────────
    const head = document.createElement('div');
    head.className = 'pal-row-head';

    const playMarker = document.createElement('span');
    playMarker.className = 'play-marker';
    playMarker.textContent = '▶';
    head.appendChild(playMarker);

    // Only the grip is draggable. Putting draggable on the row was
    // tempting but breaks the "grip-only" intent — Chrome reports
    // dragstart's e.target as the *draggable element* (the row), so a
    // closest('.grip') check never matched and reorder silently
    // stopped working.
    const grip = document.createElement('span');
    grip.className = 'grip';
    grip.textContent = '☰';
    grip.draggable = true;
    grip.dataset.testid = 'palette-grip';
    head.appendChild(grip);

    const swatch = document.createElement('canvas');
    swatch.className = 'swatch';
    head.appendChild(swatch);

    const cyclesField = document.createElement('label');
    cyclesField.className = 'row-field';
    cyclesField.appendChild(document.createTextNode('cycles '));
    const cyclesIn = document.createElement('input');
    cyclesIn.type = 'number'; cyclesIn.min = '1'; cyclesIn.max = '99';
    cyclesIn.value = entry.cycles;
    cyclesField.appendChild(cyclesIn);
    head.appendChild(cyclesField);

    const speedField = document.createElement('label');
    speedField.className = 'row-field';
    speedField.appendChild(document.createTextNode('speed '));
    const rowSpeedIn = document.createElement('input');
    // TODO: re-expose negative speeds (and playlist composition modes
    // like reverse-on-loop) once the cycle-watcher's transition logic is
    // proven against signed speeds. The earlier "allow negatives" pass
    // slowed motion to a stop mid-transition; safer to ship positive-
    // only until that path is reworked.
    rowSpeedIn.type = 'number'; rowSpeedIn.min = '0'; rowSpeedIn.max = '200';
    rowSpeedIn.value = entry.speed;
    speedField.appendChild(rowSpeedIn);
    head.appendChild(speedField);

    cyclesIn.addEventListener('change', () => {
      const v = Math.max(1, Math.min(99, +cyclesIn.value || 1));
      cyclesIn.value = v;  // clamp the visible value even if entry is unchanged
      if (v === entry.cycles) return;
      pushHistory();
      entry.cycles = v;
      if (i === displayedIdx) targetCycles = v;
    });
    cyclesIn.addEventListener('click', (e) => e.stopPropagation());
    cyclesIn.addEventListener('pointerdown', (e) => e.stopPropagation());
    rowSpeedIn.addEventListener('change', () => {
      const v = Math.max(0, Math.min(200, +rowSpeedIn.value || 0));
      rowSpeedIn.value = v;
      if (v === entry.speed) return;
      pushHistory();
      entry.speed = v;
      if (i === displayedIdx && engine && engine.nextPalette === null) {
        engine.setSpeed(v);
      }
    });
    rowSpeedIn.addEventListener('click', (e) => e.stopPropagation());
    rowSpeedIn.addEventListener('pointerdown', (e) => e.stopPropagation());

    head.addEventListener('click', () => setActive(i));

    row.appendChild(head);

    // ── Drawer ────────────────────────────────────────
    const drawer = document.createElement('div');
    drawer.className = 'pal-row-drawer';
    const inner = document.createElement('div');
    inner.className = 'pal-row-drawer-inner';
    drawer.appendChild(inner);

    // Preset row.
    const presetRow = document.createElement('div');
    presetRow.className = 'drawer-row preset-row';

    const nameIn = document.createElement('input');
    nameIn.type = 'text';
    nameIn.className = 'preset-name';
    nameIn.placeholder = 'palette name';

    const saveBtn = document.createElement('button');
    saveBtn.textContent = 'save';
    saveBtn.disabled = true;
    nameIn.addEventListener('input', () => {
      saveBtn.disabled = !nameIn.value.trim();
    });
    nameIn.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !saveBtn.disabled) {
        e.preventDefault();
        saveBtn.click();
      }
    });

    const presetSel = document.createElement('select');
    presetSel.className = 'preset-select';
    buildPresetOptions(presetSel, entry.presetName || 'rainbow');

    saveBtn.addEventListener('click', () => {
      const name = nameIn.value.trim();
      if (!name) return;
      const customs = loadCustomPresets();
      customs[name] = playlist[i].stops.map(s => ({ t: s.t, color: s.color.slice() }));
      saveCustomPresets(customs);
      nameIn.value = '';
      saveBtn.disabled = true;
      refreshAllPresetDropdowns();
      presetSel.value = 'custom:' + name;
      playlist[i].presetName = 'custom:' + name;
    });

    const switchBtn = document.createElement('button');
    switchBtn.className = 'ghost';
    switchBtn.textContent = '↻ switch';
    switchBtn.addEventListener('click', () => {
      const newStops = buildStopsFromPreset(presetSel.value);
      if (!newStops) return;
      pushHistory();
      playlist[i].stops = newStops;
      playlist[i].presetName = presetSel.value;
      if (i === activeIdx) selectedStop = 0;
      if (engine && i === displayedIdx) {
        engine.replacePalette(window.Neonic.buildRamp(newStops));
      }
      drawRowSwatch(i);
      if (i === activeIdx) {
        currentRamp = window.Neonic.buildRamp(newStops);
        drawDrawerRamp();
        syncStopColorInput();
        syncRemoveStopBtn();
      }
    });

    const presetSpacer = document.createElement('div');
    presetSpacer.style.flex = '1';
    presetRow.appendChild(nameIn);
    presetRow.appendChild(saveBtn);
    presetRow.appendChild(presetSpacer);
    presetRow.appendChild(presetSel);
    presetRow.appendChild(switchBtn);
    inner.appendChild(presetRow);

    // Gradient bar.
    const ramp = document.createElement('canvas');
    ramp.className = 'drawer-ramp';
    inner.appendChild(ramp);

    ramp.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      const r = ramp.getBoundingClientRect();
      const x = e.clientX - r.left;
      const y = e.clientY - r.top;
      const cssH = ramp.clientHeight;
      const palStops = playlist[i].stops;
      const hit = rampHandleHitTest(ramp, x, palStops);
      if (hit >= 0 && y > cssH - 26) {
        // Drag an existing stop. One history push per drag, not per
        // pointermove — pointerup commits.
        pushHistory();
        selectedStop = hit;
        activeDrag = { kind: 'ramp', stopIdx: hit, idx: i };
        drawDrawerRampOnto(ramp, palStops);
        syncStopColorInput();
        return;
      }
      if (y <= cssH - 26) {
        // Click on the bar → add a new stop.
        pushHistory();
        const cssW = ramp.clientWidth || 1;
        const t = Math.max(0, Math.min(1, 1 - x / cssW));
        const idx = Math.min(254, Math.max(0, Math.round(t * 254)));
        const built = window.Neonic.buildRamp(palStops);
        const o = idx * 3;
        palStops.push({ t, color: [built[o], built[o+1], built[o+2]] });
        selectedStop = palStops.length - 1;
        rebuildRamp();
      }
    });

    // Stop editor row.
    const stopRow = document.createElement('div');
    stopRow.className = 'drawer-row stop-row';

    const colorLabel = document.createElement('label');
    colorLabel.className = 'color-square';
    colorLabel.appendChild(document.createTextNode('color '));
    const colorIn = document.createElement('input');
    colorIn.type = 'color';
    colorIn.className = 'stop-color';
    colorLabel.appendChild(colorIn);
    // Color picker scrubbing fires 'input' once per pixel of cursor
    // motion — pushing history per micro-change would balloon the
    // stack. Push once on 'click' (before the picker opens), then
    // let 'input' update without further pushes.
    colorIn.addEventListener('click', () => {
      if (playlist[i].stops[selectedStop]) pushHistory();
    });
    colorIn.addEventListener('input', () => {
      const s = playlist[i].stops[selectedStop];
      if (s) {
        s.color = hexToRgb(colorIn.value);
        rebuildRamp();
      }
    });

    const removeStopBtn = document.createElement('button');
    removeStopBtn.className = 'ghost remove-stop';
    removeStopBtn.textContent = '× remove stop';
    removeStopBtn.disabled = entry.stops.length <= 2;
    removeStopBtn.addEventListener('click', () => {
      const ps = playlist[i].stops;
      if (ps.length <= 2) return;
      pushHistory();
      ps.splice(selectedStop, 1);
      selectedStop = Math.min(selectedStop, ps.length - 1);
      rebuildRamp();
    });

    const helper = document.createElement('span');
    helper.className = 'stop-helper';
    helper.textContent = 'click bar to add stop';

    const spacer = document.createElement('span');
    spacer.className = 'spacer';

    const removePalBtn = document.createElement('button');
    removePalBtn.className = 'remove-palette';
    removePalBtn.textContent = '× remove palette';
    removePalBtn.disabled = playlist.length === 1;
    removePalBtn.addEventListener('click', () => {
      if (playlist.length <= 1) return;
      // No confirm popup — removal is in the undo stack now.
      removePlaylistItem(i);
    });

    stopRow.appendChild(colorLabel);
    stopRow.appendChild(removeStopBtn);
    stopRow.appendChild(helper);
    stopRow.appendChild(spacer);
    stopRow.appendChild(removePalBtn);
    inner.appendChild(stopRow);

    row.appendChild(drawer);

    // Drag-and-drop reorder. The grip is the only draggable element;
    // the drag image is the whole row so the visual matches what you'd
    // expect.
    grip.addEventListener('dragstart', (e) => {
      e.dataTransfer.effectAllowed = 'move';
      e.dataTransfer.setData('text/plain', String(i));
      e.dataTransfer.setDragImage(row, 20, row.offsetHeight / 2);
      row.classList.add('dragging');
    });
    grip.addEventListener('dragend', () => row.classList.remove('dragging'));
    row.addEventListener('dragover', (e) => {
      e.preventDefault();
      row.classList.add('drag-over');
    });
    row.addEventListener('dragleave', () => row.classList.remove('drag-over'));
    row.addEventListener('drop', (e) => {
      e.preventDefault();
      row.classList.remove('drag-over');
      const from = +e.dataTransfer.getData('text/plain');
      reorderPlaylist(from, i);
    });

    root.appendChild(row);
    drawGradient(swatch, entry.stops);
    if (i === activeIdx) drawDrawerRampOnto(ramp, entry.stops);
  }
}

// ─── Wire-up ─────────────────────────────────────────────────────────────
$('clear').addEventListener('click', () => {
  pushHistory();
  state.paths = [];
  rawLiveStroke = null;
  smoothLevel = 1.5;
  bezierManualView = null;
  if (engine) { engine.stop(); engine = null; }
  outCvs.width = 1; outCvs.height = 1;
  bakeMeta.textContent = '';
  scheduleRender();
});

function snapshot() {
  return JSON.stringify({
    p: state.paths,
    s: smoothLevel,
    // Playlist state — captured so palette ops (add/remove/reorder
    // stops, switch preset, edit cycles/speed) become undoable
    // alongside drawing edits.
    pl: playlist,
    ai: activeIdx, di: displayedIdx, pi: pendingNextIdx,
    ss: selectedStop, tc: targetCycles,
  });
}
function applySnapshot(s) {
  const o = JSON.parse(s);
  state.paths = o.p;
  smoothLevel = o.s;
  // Pre-playlist snapshots (older in-memory entries) won't have `pl`.
  // Leave playlist untouched in that case so we don't blow it away.
  if (Array.isArray(o.pl)) {
    playlist.length = 0;
    for (const e of o.pl) playlist.push(e);
    activeIdx = o.ai ?? -1;
    displayedIdx = o.di ?? 0;
    pendingNextIdx = o.pi ?? -1;
    selectedStop = o.ss ?? 0;
    targetCycles = o.tc ?? 1;
    const dispEntry = playlist[displayedIdx];
    if (engine && dispEntry) {
      currentRamp = window.Neonic.buildRamp(dispEntry.stops);
      engine.setPalette(currentRamp);
      engine.setSpeed(dispEntry.speed);
    }
    renderPlaylist();
  }
  scheduleRender();
  scheduleBake();
}
function refreshHistoryButtons() {
  $('undo').disabled = undoHistory.length === 0;
  $('redo').disabled = redoHistory.length === 0;
}
function pushHistory() {
  undoHistory.push(snapshot());
  redoHistory.length = 0;
  if (undoHistory.length > 50) undoHistory.shift();
  refreshHistoryButtons();
}
function undo() {
  if (activeDrag || undoHistory.length === 0) return;
  redoHistory.push(snapshot());
  applySnapshot(undoHistory.pop());
  refreshHistoryButtons();
}
function redo() {
  if (activeDrag || redoHistory.length === 0) return;
  undoHistory.push(snapshot());
  applySnapshot(redoHistory.pop());
  refreshHistoryButtons();
}
$('undo').addEventListener('click', undo);
$('redo').addEventListener('click', redo);
// Cmd/Ctrl-Z undo; with shift = redo. Bail when focus is in a text
// field so the browser's own per-input undo still works — otherwise
// typing in a palette name input and hitting Cmd-Z would roll back
// the canvas instead of the typing.
window.addEventListener('keydown', (e) => {
  if (!(e.metaKey || e.ctrlKey) || e.key.toLowerCase() !== 'z') return;
  if (isTextFieldFocused()) return;
  e.preventDefault();
  if (e.shiftKey) redo(); else undo();
});

function isTextFieldFocused() {
  const el = document.activeElement;
  if (!el || el === document.body) return false;
  if (el.isContentEditable) return true;
  const tag = el.tagName;
  if (tag === 'TEXTAREA' || tag === 'SELECT') return true;
  if (tag !== 'INPUT') return false;
  // Sliders, colour-pickers, and the like don't capture keyboard
  // characters; only the typing-style input types should suppress.
  const t = (el.type || 'text').toLowerCase();
  return t === 'text' || t === 'number' || t === 'search' ||
         t === 'email' || t === 'url'   || t === 'tel'    ||
         t === 'password';
}

$('smooth').addEventListener('click', () => {
  if (!state.paths.length || state.paths[0].anchors.length < 2) return;
  pushHistory();
  smoothLevel = Math.min(smoothLevel * 1.8, 60);
  // Re-fit from the *current* bezier — sample it as a polyline and
  // RDP at the new (more aggressive) epsilon. Each click simplifies
  // what's already on screen rather than rolling back to the original.
  const samples = samplePath(state.paths[0], 12);
  if (samples.length < 2) return;
  const simplified = rdpSimplify(samples, smoothLevel);
  const path = polylineToBezier(simplified);
  if (path) {
    path.size = state.paths[0].size || +strokeWIn.value;
    state.paths = [path];
  }
  scheduleRender();
  scheduleBake();
});

// Truncate an SVG path d-string at the second top-level moveto so we
// only consume the first subpath. Multi-subpath SVGs sampled as one
// continuous polyline produce visible jumps where the moveto fires;
// the user said "take the first path you find and discard the rest",
// which we extend to subpaths within a single <path> too.
function firstSubpathOnly(d) {
  let firstM = -1;
  for (let i = 0; i < d.length; i++) {
    const c = d[i];
    if (c === 'M' || c === 'm') {
      if (firstM === -1) firstM = i;
      else return d.slice(0, i).trim();
    }
  }
  return d.trim();
}

// Sample the first <path> in an SVG document into a polyline and fit
// it to panel 1's viewport. Returns { anchors, size } or null if
// nothing usable was found.
function importFromSvg(text) {
  let doc;
  try { doc = new DOMParser().parseFromString(text, 'image/svg+xml'); }
  catch { return null; }
  if (doc.querySelector('parsererror')) return null;
  const path = doc.querySelector('path');
  if (!path) return null;
  const dRaw = path.getAttribute('d');
  if (!dRaw) return null;
  const d = firstSubpathOnly(dRaw);

  // Clone the full SVG tree so ancestor <g transform="..."> are preserved.
  // A fixed viewport size lets getCTM() compose all transforms correctly;
  // the absolute scale doesn't matter since we rescale to panel 1 anyway.
  const tmpSvg = doc.documentElement.cloneNode(true);
  tmpSvg.setAttribute('width', '10000');
  tmpSvg.setAttribute('height', '10000');
  tmpSvg.style.cssText = 'position:absolute;left:-99999px;width:10000px;height:10000px;opacity:0;pointer-events:none;';
  const tmpPath = tmpSvg.querySelector('path');
  if (!tmpPath) return null;
  tmpPath.setAttribute('d', d);
  document.body.appendChild(tmpSvg);
  try {
    const totalLen = tmpPath.getTotalLength();
    if (!totalLen || !isFinite(totalLen)) return null;
    const ctm = tmpPath.getCTM();
    const steps = Math.min(2000, Math.max(20, Math.ceil(totalLen)));
    const raw = [];
    for (let i = 0; i <= steps; i++) {
      const pt = tmpPath.getPointAtLength((i / steps) * totalLen);
      let px = pt.x, py = pt.y;
      if (ctm) {
        px = ctm.a * pt.x + ctm.c * pt.y + ctm.e;
        py = ctm.b * pt.x + ctm.d * pt.y + ctm.f;
      }
      raw.push({ x: px, y: py, pressure: 0.5 });
    }
    // Scale-to-fit panel 1's canvas with padding. SVG path coords
    // are usually much larger than 320×320, so we always rescale.
    let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
    for (const s of raw) {
      if (s.x < minX) minX = s.x; if (s.x > maxX) maxX = s.x;
      if (s.y < minY) minY = s.y; if (s.y > maxY) maxY = s.y;
    }
    const cssW = drawCvs.clientWidth || 320;
    const cssH = drawCvs.clientHeight || 320;
    const pad = 24;
    const w = Math.max(1, maxX - minX);
    const h = Math.max(1, maxY - minY);
    const scale = Math.min((cssW - 2*pad) / w, (cssH - 2*pad) / h);
    const tx = pad - minX * scale + ((cssW - 2*pad) - w * scale) / 2;
    const ty = pad - minY * scale + ((cssH - 2*pad) - h * scale) / 2;
    for (const s of raw) {
      s.x = s.x * scale + tx;
      s.y = s.y * scale + ty;
    }
    const simplified = rdpSimplify(raw, 0.8);
    const beziered = polylineToBezier(simplified);
    if (!beziered) return null;
    return { anchors: beziered.anchors, size: 22 };
  } finally {
    document.body.removeChild(tmpSvg);
  }
}

// Decode a .neonic.png. Anchors are required; everything else is
// optional and gets a default at apply time.
function importFromNeonicPng(buf) {
  let decoded;
  try { decoded = window.NeonicPng.decode(buf); }
  catch (err) {
    alert('Could not import: ' + err.message);
    return null;
  }
  const meta = decoded.metadata;
  if (!Array.isArray(meta.anchors) || meta.anchors.length < 2) {
    alert('PNG is missing an anchors array.');
    return null;
  }
  // Anchors in modern exports carry both pressure and width. Legacy
  // exports may have only one; we fill the other in via PF's
  // historical thinning=0.4 formula:
  //   width = strokeWidth * (0.6 + 0.8 * pressure)
  const importBase = meta.strokeWidth != null ? +meta.strokeWidth : 22;
  const importedAnchors = meta.anchors.map((a) => {
    const out = { ...a };
    if (out.pressure == null) {
      out.pressure = out.width != null
        ? (out.width / importBase - 0.6) / 0.8
        : 0.5;
    }
    if (out.width == null) {
      out.width = importBase * (0.6 + 0.8 * out.pressure);
    }
    return out;
  });
  return {
    anchors: importedAnchors,
    size: importBase,
    strokeWidth: meta.strokeWidth,
    // Legacy exports lacked saved thinning; their widths assumed PF's
    // historical default of 0.4 baked into the formula.
    thinning: meta.thinning != null ? +meta.thinning : 0.4,
    palettes: Array.isArray(meta.palettes) && meta.palettes.length ? meta.palettes : null,
  };
}

function applyImport(imp) {
  pushHistory();
  state.paths = [{ anchors: imp.anchors, size: imp.size }];
  smoothLevel = 1.5;
  if (imp.strokeWidth != null) {
    strokeWIn.value = imp.strokeWidth;
    strokeWVal.textContent = imp.strokeWidth;
    strokeWLast = +imp.strokeWidth;
  } else {
    strokeWLast = +strokeWIn.value;
  }
  // Restore thinning before recomputing widths so the recompute is
  // lossless: saved widths satisfy width = size × formula(pressure,
  // savedThinning), and we evaluate the formula at that same value.
  if (imp.thinning != null) {
    thinningIn.value = String(imp.thinning);
    thinningVal.textContent = String(imp.thinning);
  }
  recomputeWidths(state.paths[0], +thinningIn.value);
  // Replace the playlist only when the import provided one. Imports
  // without palette data (SVG, or partial neonic.png) keep whatever
  // playlist the user already had.
  if (imp.palettes) {
    playlist.length = 0;
    for (const p of imp.palettes) {
      playlist.push({
        stops: p.stops.map(s => ({ t: s.t, color: s.color.slice() })),
        speed: p.speed != null ? p.speed : 60,
        cycles: p.cycles != null ? p.cycles : 1,
        // presetName persists which dropdown entry the preset-switch UI
        // should show for this row. Older PNGs that pre-date this field
        // fall back to 'rainbow' via the dropdown's default.
        presetName: p.presetName,
      });
    }
  }
  selectedStop = 0;
  activeIdx = -1;
  displayedIdx = 0;
  pendingNextIdx = -1;
  targetCycles = playlist[0]?.cycles || 1;
  currentRamp = window.Neonic.buildRamp(playlist[0].stops);
  if (engine && playlist[0]) {
    engine.setPalette(currentRamp);
    engine.setSpeed(playlist[0].speed);
  }
  renderPlaylist();
  scheduleRender();
  scheduleBake();
}

$('import').addEventListener('click', () => {
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = 'image/png,.png,image/svg+xml,.svg';
  input.onchange = async () => {
    const file = input.files && input.files[0];
    if (!file) return;
    const isSvg = /\.svg$/i.test(file.name) || file.type === 'image/svg+xml';
    let imp;
    try {
      if (isSvg) {
        imp = importFromSvg(await file.text());
        if (!imp) {
          alert('No usable <path> found in the SVG.');
          return;
        }
      } else {
        const buf = new Uint8Array(await file.arrayBuffer());
        imp = importFromNeonicPng(buf);
        if (!imp) return;  // alert already shown
      }
    } catch (err) {
      alert('Could not import: ' + err.message);
      return;
    }
    applyImport(imp);
  };
  input.click();
});

$('export').addEventListener('click', async (e) => {
  if (state.paths.length === 0) return;
  const btn = e.currentTarget;
  btn.disabled = true;
  const origLabel = btn.textContent;
  btn.textContent = 'Rendering…';
  try {
    // Bake at half the historical 1.6 scale purely to render the
    // static preview image that lives inside the PNG. Playback is
    // independent of this — the engine re-bakes from anchors at the
    // consumer's display resolution.
    const exportScale = 0.8;
    const bake = window.Neonic.bakeFromStroke({
      stroke: samplePath(state.paths[0], 16),
      scale: exportScale, padding: 24, half: 'full',
    });
    // Render the PNG's static preview using palette[0] at engine offset 0
    // — i.e. the exact frame the embed will display the moment it starts.
    // The engine's formula at off=0, baseStartOff=0 maps palette index `idx`
    // to ramp[(256 - idx) mod 255] (so palette[1] = ramp[0]).
    const firstRamp = window.Neonic.buildRamp(playlist[0].stops);
    const off = document.createElement('canvas');
    off.width = bake.width; off.height = bake.height;
    const offCtx = off.getContext('2d');
    const im = offCtx.createImageData(bake.width, bake.height);
    const data32 = new Uint32Array(im.data.buffer);
    const pal32 = new Uint32Array(256);
    pal32[0] = 0;
    for (let idx = 1; idx <= 255; idx++) {
      const k = (256 - idx) % 255;
      const r = firstRamp[k*3], g = firstRamp[k*3+1], b = firstRamp[k*3+2];
      pal32[idx] = (255 << 24) | (b << 16) | (g << 8) | r;
    }
    for (let i = 0; i < bake.indices.length; i++) data32[i] = pal32[bake.indices[i]];
    offCtx.putImageData(im, 0, 0);
    const bytes = await window.NeonicPng.encode({
      canvas: off,
      anchors: state.paths[0].anchors,
      palettes: playlist,
      // path.size is the base for thinning recompute; slider value is
      // a fallback for very old paths that predate path.size.
      strokeWidth: state.paths[0].size != null ? state.paths[0].size : +strokeWIn.value,
      // Persist thinning so import can restore the slider — without
      // this, recompute on load shifts widths to whatever the slider
      // happens to be set to.
      thinning: +thinningIn.value,
      scale: exportScale,
      padding: 24,
      half: 'full',
    });
    const url = URL.createObjectURL(new Blob([bytes], { type: 'image/png' }));
    const a = document.createElement('a');
    a.href = url;
    a.download = 'logo.neonic.png';
    a.click();
    URL.revokeObjectURL(url);
  } finally {
    btn.disabled = false;
    btn.textContent = origLabel;
  }
});

$('record').addEventListener('click', async (e) => {
  if (!engine) return;
  const btn = e.currentTarget;
  const speed = Math.abs(engine.speed);
  btn.disabled = true;
  try {
    if (speed < 0.5) {
      const a = document.createElement('a');
      a.href = outCvs.toDataURL('image/png');
      a.download = 'palette-cycle.png';
      a.click();
      return;
    }
    const dur = Math.min(255 / speed, 10);
    btn.textContent = 'Recording…';
    const stream = outCvs.captureStream(60);
    const rec = new MediaRecorder(stream, { mimeType: 'video/webm' });
    const chunks = [];
    rec.ondataavailable = (ev) => ev.data.size && chunks.push(ev.data);
    rec.start();
    await new Promise((r) => setTimeout(r, dur * 1000));
    await new Promise((r) => { rec.onstop = r; rec.stop(); });
    const url = URL.createObjectURL(new Blob(chunks, { type: 'video/webm' }));
    const a = document.createElement('a');
    a.href = url;
    a.download = 'palette-cycle.webm';
    a.click();
    URL.revokeObjectURL(url);
  } finally {
    btn.disabled = false;
    btn.textContent = 'Record';
  }
});

// Thinning recompute: each anchor's pressure is preserved; only the
// width formula's curve changes. Because width = path.size * formula,
// reapplying with a new thinning gives the per-anchor variation the
// user expects.
thinningIn.addEventListener('input', () => {
  thinningVal.textContent = thinningIn.value;
  if (state.paths.length && state.paths[0].anchors) {
    recomputeWidths(state.paths[0], +thinningIn.value);
    scheduleBake();
  }
  scheduleRender();
});

// Stroke slider scales path.size by ratio (new / old). recomputeWidths
// then rescales every anchor's width linearly. Future fresh draws
// still use the slider value as PF's input size.
let strokeWLast = +strokeWIn.value;
strokeWIn.addEventListener('input', () => {
  const v = +strokeWIn.value;
  strokeWVal.textContent = strokeWIn.value;
  if (v !== strokeWLast && state.paths.length && state.paths[0].anchors) {
    const path = state.paths[0];
    const ratio = v / strokeWLast;
    path.size = (path.size || strokeWLast) * ratio;
    recomputeWidths(path, +thinningIn.value);
  }
  strokeWLast = v;
  scheduleRender();
  scheduleBake();
});

$('addInline').addEventListener('click', addToPlaylist);

// Esc closes the open drawer — but only when no text input is focused,
// so it doesn't fight per-input typing cancellation.
window.addEventListener('keydown', (e) => {
  if (e.key !== 'Escape') return;
  if (isTextFieldFocused()) return;
  if (activeIdx >= 0) {
    e.preventDefault();
    closeDrawer();
  }
});

window.addEventListener('resize', () => {
  dpr = window.devicePixelRatio || 1;
  drawDrawerRamp();
  if (activeIdx >= 0) drawRowSwatch(activeIdx);
  scheduleRender();
});

// ─── Init ────────────────────────────────────────────────────────────────
// Playlist always has at least one entry. activeIdx = -1 means no
// drawer is open by default; the user opens one by clicking a row.
playlist.push({
  stops: buildStopsFromPreset('rainbow'),
  speed: 60,
  cycles: 1,
  presetName: 'rainbow',
});
activeIdx = -1;
displayedIdx = 0;
selectedStop = 0;
currentRamp = window.Neonic.buildRamp(playlist[0].stops);
refreshHistoryButtons();
renderPlaylist();
scheduleRender();

// ─── Chrome wiring ───────────────────────────────────────────────────────
// The visible segmented control mirrors the hidden #bezierMode select, so
// the existing change-event handler keeps driving all the tap-mode logic.
const toolSeg = document.getElementById('tool-seg');
if (toolSeg) {
  toolSeg.addEventListener('click', (e) => {
    const btn = e.target.closest('button[data-tool]');
    if (!btn) return;
    for (const b of toolSeg.querySelectorAll('button')) b.classList.remove('on');
    btn.classList.add('on');
    const sel = document.getElementById('bezierMode');
    sel.value = btn.dataset.tool;
    sel.dispatchEvent(new Event('change'));
  });
}

// Editable zoom %: typing a number applies it as a manual view scale.
// On blur/Enter, parse, clamp, seed manual view, re-render.
const zoomVal = document.getElementById('zoom-val');
if (zoomVal) {
  function applyZoom() {
    const n = parseFloat(zoomVal.value);
    if (!isFinite(n) || n <= 0) { scheduleRender(); return; }
    const newScale = Math.max(0.05, Math.min(50, n / 100));
    // Anchor the zoom on the bezier canvas centre — matches what the
    // +/− buttons do.
    const cx = bezCvs.clientWidth / 2;
    const cy = bezCvs.clientHeight / 2;
    const v = ensureManualView();
    const logicalX = (cx - v.tx) / v.scale;
    const logicalY = (cy - v.ty) / v.scale;
    v.scale = newScale;
    v.tx = cx - logicalX * newScale;
    v.ty = cy - logicalY * newScale;
    scheduleRender();
  }
  zoomVal.addEventListener('change', applyZoom);
  zoomVal.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') { e.preventDefault(); zoomVal.blur(); }
    if (e.key === 'Escape') { e.preventDefault(); zoomVal.blur(); scheduleRender(); }
  });
}
</script>
